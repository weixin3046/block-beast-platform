services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: blockbeast
      POSTGRES_USER: blockbeast
      POSTGRES_PASSWORD: blockbeast
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockbeast -d blockbeast"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  uploads-init:
    image: alpine:3.22
    command: ["sh", "-c", "mkdir -p /data/uploads && chown 65532:65532 /data/uploads && chmod 0700 /data/uploads"]
    volumes:
      - uploads-data:/data/uploads
    restart: "no"

  api:
    build: .
    command: ["/app/api"]
    env_file: .env
    environment:
      UPLOAD_STORAGE_DRIVER: local
      LOCAL_UPLOAD_ROOT: /data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      uploads-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/data/uploads

  worker:
    build: .
    command: ["/app/worker"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  realtime:
    build: .
    command: ["/app/realtime"]
    env_file: .env
    ports:
      - "8081:8081"

volumes:
  postgres-data:
  uploads-data:
