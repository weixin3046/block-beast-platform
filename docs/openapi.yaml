  "/v1/webhooks/chain/deposits":
    post:
      tags:
      - Chain
      operationId: chainDepositWebhook
      summary: 链上充值回调（服务商调用）
      description: |
        PQPA 推送充值状态。请求必须携带 `X-Api-Key`、`X-Timestamp`（毫秒）、`X-Nonce`、`X-Signature`，并使用 `PQPA_API_SECRET` 验签。
        签名内容为 `方法\n路径\n时间戳\n随机数\n正文SHA256(十六进制)` 的 HMAC-SHA256（十六进制），密钥由平台分配；时间戳允许偏移默认 5 分钟。
        仅 `txStatus=SETTLED` 入账。充值按服务商事件 ID 与交易哈希幂等，重复回调不会重复入账；未知资产或非平台地址也返回 PQPA 成功 ACK，供后台人工排查。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DepositWebhookRequest"
      responses:
        '200':
          description: 已处理，响应必含 `{"code":0}`；首次入账时还包含 deposit。
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    enum:
                    - 0
                  deposit:
                    "$ref": "#/components/schemas/DepositResult"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '503':
          "$ref": "#/components/responses/Unavailable"
  "/v1/webhooks/chain/withdrawals":
    post:
      tags:
      - Chain
      operationId: chainWithdrawalWebhook
      summary: PQPA 提现状态回调
      description: 使用 `X-Api-Key`、`X-Timestamp`、`X-Nonce`、`X-Signature` 和 `PQPA_API_SECRET`
        验签。PQPA `SUCCESS` 核销冻结余额，`FAILED` 自动解冻；中间状态仅幂等记录并返回成功 ACK。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - event
              - id
              - appOrderNo
              - chainTokenId
              - toAddress
              - amount
              - status
              properties:
                event:
                  type: string
                  enum:
                  - withdraw
                id:
                  type: integer
                  format: int64
                appOrderNo:
                  type: string
                  description: 平台提现 UUID
                chainId:
                  type: integer
                  format: int64
                chainTokenId:
                  type: integer
                  format: int64
                toAddress:
                  type: string
                amount:
                  type:
                  - string
                  - number
                txHash:
                  type: string
                status:
                  type: string
                  example: SUCCESS
      responses:
        '200':
          description: 已处理或已忽略
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
