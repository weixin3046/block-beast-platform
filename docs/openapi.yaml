      - name: enabled
        in: query
        schema:
          type: boolean
        description: 只接受 true/false，省略不过滤
      - name: page
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 92233720368547758
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
        description: 0 使用默认20，非零值裁剪到1至100
