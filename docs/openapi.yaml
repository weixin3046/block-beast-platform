          description: 筛选后的总条数及当前页，空列表为 []。
          content:
            application/json:
              schema:
                type: object
                required:
                - count
                - items
                properties:
                  count:
                    type: integer
                    format: int64
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/CustomerPhrase"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '403':
          "$ref": "#/components/responses/Forbidden"
