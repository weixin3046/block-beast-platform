  /v1/game-rooms:
    get:
      tags: [Rounds]
      operationId: listGameRooms
      summary: 查询启用的游戏房间及房内玩法
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 动态房间列表。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameRoom'
  /v1/hash/menus:
    get:
      tags: [Rounds]
      operationId: listHashMenus
      summary: 查询六个哈希赔率房间及共享区块菜单
      description: 返回启用的固定赔率房间、每个房间共同关联的 9/13/17/19/23/29 区块玩法，以及按币种配置的竞猜、躲避和上下路倍率与累计上限。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 哈希菜单聚合配置。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HashConfig'
  /v1/hash/trends:
    get:
      tags: [Rounds]
      operationId: getHashTrends
      summary: 查询共享哈希玩法的开奖结果走势
      description: 六个赔率房间共享同一目标区块，因此只按 hash_9/hash_13/hash_17/hash_19/hash_23/hash_29 查询。结果按期数倒序，summary 返回当前尾数遗漏和最新大小、单双连开次数。
      security:
        - bearerAuth: []
      parameters:
        - name: game_type
          in: query
          required: true
          schema:
            type: string
            enum: [hash_9, hash_13, hash_17, hash_19, hash_23, hash_29]
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: 走势图结果。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HashTrend' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/hash/config:
    get:
      tags: [Admin]
      operationId: adminGetHashConfig
      summary: 查询完整哈希菜单与参数矩阵
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 包含停用房间的完整配置。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HashConfig'
    put:
      tags: [Admin]
      operationId: adminUpdateHashConfig
      summary: 原子更新六个哈希房间的名称、顺序、状态与币种参数
      description: 必须提交当前 expected_version；版本冲突返回 409。六个房间及其六个共享区块关系固定，接口不会新增或删除房间。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HashConfigUpdate'
      responses:
        '200':
          description: 更新后的完整配置。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HashConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/game-rooms:
    get:
      tags: [Admin]
      operationId: adminListGameRooms
      summary: 查询全部游戏房间
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 房间列表。
  /v1/admin/game-types:
    get:
      tags: [Admin]
      operationId: adminListGameTypes
      summary: 查询全部游戏玩法与结算规则
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 游戏玩法列表。
  /v1/admin/rounds:
    get:
      tags: [Admin]
      operationId: adminListRounds
      summary: 查询运营轮次
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 轮次列表。
  /v1/rounds:
    get:
      tags: [Rounds]
      operationId: listOpenRounds
      summary: 查询指定游戏的开放轮次
      security:
        - bearerAuth: []
      parameters:
        - name: game_type
          in: query
          required: true
          schema:
            type: string
          example: dice
        - name: limit
          in: query
          required: false
          description: 返回数量，默认 50，范围 1–100。
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: 开放轮次，按封盘时间升序。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Round'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/rounds/state:
    get:
      tags: [Rounds]
      operationId: getRoundState
      summary: 查询指定玩法的当前轮次和上一期开奖结果
      security:
        - bearerAuth: []
      parameters:
        - name: game_type
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 当前最早开放轮次、最近已结算轮次和服务端 UTC 时间；尚不存在时对应轮次字段为 null。客户端应用 server_time 校准本地时钟后计算倒计时。
          content:
            application/json:
              schema:
                type: object
                required: [current, previous, server_time]
                properties:
                  current:
                    oneOf:
                      - $ref: '#/components/schemas/Round'
                      - type: 'null'
                  previous:
                    oneOf:
                      - $ref: '#/components/schemas/Round'
                      - type: 'null'
                  server_time:
                    type: string
                    format: date-time
                    description: 服务端当前 UTC 时间，用于校准客户端倒计时。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/rounds/{roundID}:
    get:
      tags: [Rounds]
      operationId: getRound
      summary: 查询单个轮次
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoundID'
      responses:
        '200':
          description: 轮次详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Round'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/rounds/{roundID}/cancel:
    post:
      tags: [Rounds]
      operationId: cancelRound
      summary: 取消轮次并退款
      description: 仅开放或已封盘轮次可以取消。已接受的投注会退款；重复取消不会重复退款。仅限 operator/admin 角色调用，调用会写入审计日志。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoundID'
      responses:
        '200':
          description: 轮次已取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancellation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/bets/public-feed:
    get:
      tags: [Bets]
      summary: 查询所有真实和虚拟玩家的公开投注列表
      description: 仅返回玩家公开资料和投注数据，不返回登录账号、内部 UUID、钱包余额或 IP。默认同时包含真实和虚拟玩家。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: player_type, in: query, schema: { type: string, enum: [all, real, virtual], default: all } }
        - { name: game_type, in: query, schema: { type: string } }
        - { name: currency, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [accepted, cancelled, won, lost, refunded] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: 按投注时间倒序排列的公开投注列表。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicBet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/bets:
    get:
      tags: [Bets]
      summary: 查询本人的投注列表
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [accepted, won, lost, refunded, cancelled] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: 投注列表。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Bet' }
    post:
      tags: [Bets]
      operationId: placeBet
      summary: 创建幂等投注
      description: 对同一 account_id 和 client_request_id 的重复请求会返回既有投注，不会再次扣款。仅本人或 operator/admin 可为指定账号投注。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceBetRequest'
            example:
              client_request_id: web-20260720-0001
              round_id: 8374209d-069a-4e6a-b1f2-c166e3b5ee52
              account_id: 100009
              currency: USDT
              selection:
                color: red
              stake_minor: 2500
      responses:
        '201':
          description: 投注已接受，或同一幂等键对应的既有投注。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/bets/{betID}:
    get:
      tags: [Bets]
      operationId: getBet
      summary: 查询投注记录
      description: 仅本人或 operator/admin 可查看对应账号的投注。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BetID'
      responses:
        '200':
          description: 投注详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/bets/{betID}/cancel:
    post:
      tags: [Bets]
      operationId: cancelBet
      summary: 封盘前取消本人的投注并原路退款
      description: 仅 accepted 且当前时间早于 bet_closes_at 的投注可以取消；重复取消幂等返回既有 cancelled 记录。退款、账本与 outbox 事件在同一事务提交。
      security:
        - bearerAuth: []
      parameters:
        - name: betID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 投注已取消并退款。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bet' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/wallets/{accountID}:
    get:
      tags: [Wallets]
      operationId: getWalletBalance
      summary: 查询钱包余额
      description: 仅本人或 operator/admin 可查看对应账号的钱包。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountID'
        - name: currency
          in: query
          required: true
          schema:
            type: string
          example: USDT
      responses:
        '200':
          description: 钱包余额
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletBalance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/webhooks/chain/deposits:
    post:
      tags: [Chain]
      operationId: chainDepositWebhook
      summary: 链上充值回调（服务商调用）
      description: |
        PQPA 推送充值状态。请求必须携带 `X-Api-Key`、`X-Timestamp`（毫秒）、`X-Nonce`、`X-Signature`，并使用 `PQPA_API_SECRET` 验签。
        签名内容为 `方法\n路径\n时间戳\n随机数\n正文SHA256(十六进制)` 的 HMAC-SHA256（十六进制），密钥由平台分配；时间戳允许偏移默认 5 分钟。
        仅 `txStatus=SETTLED` 入账。充值按服务商事件 ID 与交易哈希幂等，重复回调不会重复入账；未知资产或非平台地址也返回 PQPA 成功 ACK，供后台人工排查。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositWebhookRequest'
      responses:
        '200':
          description: 已处理，响应必含 `{"code":0}`；首次入账时还包含 deposit。
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: { type: integer, enum: [0] }
                  deposit: { $ref: '#/components/schemas/DepositResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/webhooks/chain/withdrawals:
    post:
      tags: [Chain]
      operationId: chainWithdrawalWebhook
      summary: PQPA 提现状态回调
      description: 使用 `X-Api-Key`、`X-Timestamp`、`X-Nonce`、`X-Signature` 和 `PQPA_API_SECRET` 验签。PQPA `SUCCESS` 核销冻结余额，`FAILED` 自动解冻；中间状态仅幂等记录并返回成功 ACK。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, id, appOrderNo, chainTokenId, toAddress, amount, status]
              properties:
                event: { type: string, enum: [withdraw] }
                id: { type: integer, format: int64 }
                appOrderNo: { type: string, description: 平台提现 UUID }
                chainId: { type: integer, format: int64 }
                chainTokenId: { type: integer, format: int64 }
                toAddress: { type: string }
                amount: { type: string }
                txHash: { type: string }
                status: { type: string, example: SUCCESS }
      responses:
        '200': { description: 已处理或已忽略 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/deposit-addresses:
    get:
      tags: [Chain]
      operationId: getDepositAddress
      summary: 查询玩家充值地址
      security:
        - bearerAuth: []
      parameters:
        - name: chain_code
          in: query
          required: true
          schema: { type: string }
        - name: token_code
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: 充值地址 }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Chain]
      operationId: createDepositAddress
      summary: 创建玩家 PQPA 充值地址
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chain_code, token_code]
              properties:
                chain_code: { type: string, example: POLYGON }
                token_code: { type: string, example: USDT }
      responses:
        '201': { description: 已创建或返回既有充值地址 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { description: PQPA 服务不可用 }
  /v1/assets:
    get:
      tags: [Chain]
      operationId: listProviderAssets
      summary: 查询 PQPA 当前启用的链、币种和充提能力
      description: 返回 Worker 从 PQPA 自动同步的动态配置。玩家端不得硬编码网络；充值只展示 `support_deposit=true`，提现只展示 `support_withdraw=true`。
      responses:
        '200':
          description: PQPA 当前启用的充值资产。
          content:
            application/json:
              schema:
                type: object
                required: [provider, assets]
                properties:
                  provider: { type: string, example: pqpa }
                  assets:
                    type: array
                    items:
                      type: object
                      required: [chain_code, token_code, token_name, decimals]
                      properties:
                        chain_code: { type: string, example: POLYGON }
                        token_code: { type: string, example: USDT }
                        token_name: { type: string, example: USDT }
                        decimals: { type: integer, example: 6 }
                        support_deposit: { type: boolean }
                        support_withdraw: { type: boolean }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/withdrawals:
    get:
      tags: [Chain]
      summary: 查询本人的 USDT 提现列表
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 提现申请列表。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Withdrawal' }
    post:
      tags: [Chain]
      operationId: requestWithdrawal
      summary: 创建提现申请
      description: 从可用余额扣减并冻结申请金额，创建 requested 状态的提现申请。服务端校验目标地址、单笔最小/最大金额及 UTC 自然日累计限额；失败或拒绝的申请不占每日额度。同一 client_request_id 重复请求优先返回既有申请，不会因限额调整而重复冻结或被误拒绝。身份取自访问令牌，申请写入审计日志。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawalRequest'
      responses:
        '201':
          description: 提现申请已创建（或幂等键对应的既有申请）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Withdrawal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/withdrawals/{withdrawalID}:
    get:
      tags: [Chain]
      operationId: getWithdrawal
      summary: 查询提现申请
      description: 仅本人或 operator/admin 可查看。
      security:
        - bearerAuth: []
      parameters:
        - name: withdrawalID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 提现申请详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Withdrawal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/wallet-adjustments:
    post:
      tags: [Admin]
      operationId: adminWalletAdjustment
      summary: 管理员直接上分、清退、赠分或人工扣分
      description: |
        允许 admin/operator；必须在本请求内验证后台全局一级密码 first_password。amount 为正数展示金额字符串，由后端换算。
        credit/reward 增加可用余额，debit/penalty 扣可用余额；不动冻结金额、不触发链上付款。
        虚拟账户禁止 debit/penalty，所有已登记启用币种均可选择。
        同一管理员的 request_id 在本接口和旧上分入口间共用，重复返回首次结果；更改用户、币种、操作、金额或备注返回 409。
        余额、流水、审计、幂等结果和 outbox 同事务提交。资金密码不进入日志、流水或事件。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalletAdjustmentRequest' }
      responses:
        '200':
          description: 操作成功或幂等重放；余额均为首次操作快照。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletAdjustmentResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 可用余额不足、未设置全局一级密码或幂等参数冲突。 }
        '429': { description: 验证锁定，Retry-After 为 900 秒。 }
        '503': { description: 资金或后台操作密码服务不可用。 }
  /v1/admin/credits:
    post:
      tags: [Admin]
      operationId: adminCredit
      summary: 管理员手动上分（已启用的任意币种）
      description: |
        为指定用户增加平台余额。前端提交展示单位的十进制字符串 amount，后端按币种精度换算为最小单位。按 request_id 幂等，重复请求返回首次结果不重复入账。
        所有币种统一写入 ledger_entries，并在同一事务生成钱包 outbox 事件；币种必须已登记且启用。
        用户尚无该币种钱包时随充值创建。允许 admin/operator 角色，必须提交后台全局 first_password；与统一资金操作共用校验、事务、审计和幂等键。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreditRequest'
            example:
              user_id: "100009"
              currency: POINTS
              amount: "100"
              remark: 活动补偿
              request_id: admin-20260723-0001
              first_password: 后台全局一级密码
      responses:
        '200':
          description: 充值结果（credited=false 表示重复请求未重复入账）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          description: 未设置全局一级密码或幂等参数冲突。
        '429': { description: 验证锁定，Retry-After 为 900 秒。 }
  /v1/stamina/consume:
    post:
      tags: [Stamina]
      operationId: consumeStamina
      summary: 参加活动消耗体力
      description: 按 (user_id, activity_id) 幂等扣减体力，重复请求不重复扣减。仅本人或 operator/admin 可调用。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
