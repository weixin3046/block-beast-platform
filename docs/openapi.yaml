openapi: 3.1.0
info:
  title: Block Beast Platform API
  version: 0.1.0
  description: |
    对外 error 提示统一为简体中文；HTTP 状态码及机器可读字段、枚举保持不变。未知内部错误统一返回“操作失败，请稍后重试”，不透传数据库或第三方错误详情。
    Block Beast 的 HTTP 接口。内部金额使用最小单位整数；后台上分 amount 使用展示金额字符串，由后端换算。其他仍命名为 _minor 的请求字段继续接收最小单位整数。平台精度读取 GET /v1/currencies；POINTS、JADE、ORIGIN_STONE 为3位，四种体力为0位，USDT为6位。GET /v1/assets 的 decimals 仅用于对应链上网络，不解释平台钱包余额。

    除健康检查、平台信息和认证接口外的业务接口均需携带 `Authorization: Bearer <access_token>` 访问令牌；登录或注册返回默认有效期 15 分钟的访问令牌和可轮换的刷新令牌。投注、钱包等账号级资源仅本人或具备 operator/admin 角色的账号可访问；轮次取消仅限 operator/admin。
  license:
    name: UNLICENSED
security: []
servers:
  - url: /
    description: Current deployment (same origin)
  - url: http://localhost:8080
    description: Local development
tags:
  - name: System
    description: 存活与依赖就绪检查。
  - name: Platform
    description: 平台元信息。
  - name: Auth
    description: 登录与访问令牌。
  - name: Rounds
    description: 游戏轮次查询与操作。
  - name: Bets
    description: 投注创建和查询。
  - name: Wallets
    description: 钱包余额查询。
  - name: Chain
    description: 链上充值回调与提现。
  - name: Admin
    description: 管理后台操作（积分/USDT/体力充值）。
  - name: Stamina
    description: 体力消耗与流水。
  - name: Tasks
    description: 参与活动产生的投注任务。
  - name: Chat
    description: 公共聊天与客服会话。
  - name: Uploads
    description: S3 兼容对象存储直传与确认。
  - name: Leaderboards
    description: 已结算有效投注的 UTC 每日排行榜。
  - name: RedPackets
    description: 聊天室红包创建、领取和查询。
paths:
  /v1/admin/users/{userID}/password:
    put:
      tags: [Admin]
      summary: 后台重置用户登录密码
      description: 仅admin，必须验证后台全局二级操作密码。交易密码指个人secondary-password，与后台全局密码独立；重置撤销刷新会话，已签发访问令牌仍在原有效期内，不承诺立即踢出。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: integer, format: int64, minimum: 100000 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [new_password, second_password]
              properties:
                new_password: { type: string, format: password, writeOnly: true, minLength: 12, description: UTF-8最多128字节，不能全空白 }
                second_password: { type: string, format: password, writeOnly: true, minLength: 1 }
      responses:
        '204': { description: 已更新并记录审计 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 后台操作密码未设置 }
        '429': { description: 后台操作密码验证已锁定 }
  /v1/admin/users/{userID}/secondary-password:
    put:
      tags: [Admin]
      summary: 后台重置用户个人交易密码
      description: 仅admin，必须验证后台全局二级操作密码。交易密码指个人secondary-password，与后台全局密码独立；重置撤销刷新会话，已签发访问令牌仍在原有效期内，不承诺立即踢出。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: integer, format: int64, minimum: 100000 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [new_password, second_password]
              properties:
                new_password: { type: string, format: password, writeOnly: true, minLength: 1, description: UTF-8最多128字节，不能全空白 }
                second_password: { type: string, format: password, writeOnly: true, minLength: 1 }
      responses:
        '204': { description: 已更新并记录审计 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 后台操作密码未设置 }
        '429': { description: 后台操作密码验证已锁定 }
  /v1/admin/users/{userID}/mute:
    put:
      tags: [Admin]
      summary: 设置或解除全局聊天禁言
      description: admin/operator 可操作；operator 不能操作后台账号。禁言不等于禁用，不影响登录及投注；实际 Socket 发消息时检查。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: integer, format: int64, minimum: 100000 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [muted]
              properties:
                muted: { type: boolean }
      responses:
        '204': { description: 已更新并记录审计 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 后台操作密码未设置 }
        '429': { description: 后台操作密码验证已锁定 }
  /v1/admin/phrases:
    get:
      tags: [Admin]
      summary: 分页查询共享话术
      description: 允许 admin/operator；不要求操作密码。分类精确匹配，默认包含启用及停用项，按 sort 升序、id 降序。无预置话术。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: category, in: query, schema: { type: string }, description: 去除首尾空白，空值不过滤 }
        - { name: enabled, in: query, schema: { type: boolean }, description: 只接受 true/false，省略不过滤 }
        - { name: page, in: query, schema: { type: integer, format: int64, minimum: 0, maximum: 92233720368547758, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 }, description: 0 使用默认20，非零值裁剪到1至100 }
      responses:
        '200':
          description: 筛选后的总条数及当前页，空列表为 []。
          content:
            application/json:
              schema:
                type: object
                required: [count, items]
                properties:
                  count: { type: integer, format: int64 }
                  items: { type: array, items: { $ref: '#/components/schemas/CustomerPhrase' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: 幂等新增共享话术
      description: 允许 admin/operator。不要求操作密码。request_id 必填，同一管理员重试复用 UUID；相同规范化参数返回现存话术，不重复创建和审计。参数不同或已删除返回409。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerPhraseCreate' }
      responses:
        '200': { description: 创建或重放结果, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPhrase' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/phrases/{phraseID}:
    parameters:
      - { name: phraseID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    put:
      tags: [Admin]
      summary: 完整编辑话术
      description: 允许 admin/operator。category/sort/enabled 省略分别重置为空字符串/0/false；created_at 不变。不要求操作密码。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerPhraseInput' }
      responses:
        '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPhrase' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      summary: 删除话术
      description: 允许 admin/operator。不要求操作密码。不影响已发送聊天记录；不存在或重复删除返回404。内部保留删除标记保障创建幂等，不提供恢复接口。
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 已删除 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/phrases/{phraseID}/enabled:
    put:
      tags: [Admin]
      summary: 启用或停用话术
      description: 允许 admin/operator。不要求操作密码。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: phraseID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPhrase' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/phrases/order:
    put:
      tags: [Admin]
      summary: 原子调整全局话术排序
      description: 允许 admin/operator。不要求操作密码。包含所有分类及停用项；指定ID置前，未指定项按原 sort升序/id降序追加，统一设置sort为0开始连续整数。空数组重编号全部现存话术，不能传null或省略ids。不存在的ID返回404，重复或非正数返回400；失败整体回滚。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ids]
              properties:
                ids: { type: array, uniqueItems: true, items: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: 排序后的全部话术
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CustomerPhrase' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/security-passwords:
    get:
      tags: [Admin]
      summary: 查询全局操作密码设置状态
      description: admin/operator 可调用；个人二级密码与此无关，无默认密码。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 只返回设置状态，不返回密码或哈希。
          content:
            application/json:
              schema:
                type: object
                required: [first_set, second_set]
                properties:
                  first_set: { type: boolean }
                  second_set: { type: boolean }
  /v1/admin/security-passwords/{level}:
    put:
      tags: [Admin]
      summary: 管理员设置或重置全局操作密码
      description: 仅 admin；验证当前管理员登录密码，不要求旧操作密码。新密码非空且 UTF-8 最多 128 字节。连续错误达到 5 次锁定 15 分钟。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: level, in: path, required: true, schema: { type: string, enum: [first, second] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password, login_password]
              properties:
                password: { type: string, format: password, writeOnly: true, minLength: 1, description: 新全局操作密码，UTF-8 最多 128 字节 }
                login_password: { type: string, format: password, writeOnly: true, minLength: 1, description: 当前管理员登录密码，UTF-8 最多 1024 字节 }
      responses:
        '204': { description: 已设置并记录不含密码的审计 }
        '400': { description: 参数无效 }
        '401': { description: 未登录或登录密码错误 }
        '403': { description: 非管理员 }
        '429': { description: 验证锁定，Retry-After 为 900 秒 }
  /v1/admin/security-passwords/{level}/verify:
    post:
      tags: [Admin]
      summary: 验证全局操作密码
      description: admin/operator 可调用。仅本次验证，不签发凭证；业务请求仍必须提交操作密码。按账号及用途独立累计失败次数，15 分钟内失败 5 次锁定 15 分钟。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: level, in: path, required: true, schema: { type: string, enum: [first, second] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, format: password, writeOnly: true, minLength: 1, description: UTF-8 最多 128 字节 }
      responses:
        '204': { description: 验证通过 }
        '400': { description: 参数无效 }
        '401': { description: 未登录或操作密码错误 }
        '403': { description: 无后台角色 }
        '409': { description: 尚未设置该级密码 }
        '429': { description: 验证锁定，Retry-After 为 900 秒 }
  /v1/users/me/ledger:
    get:
      tags: [Wallets]
      summary: 本人所有币种统一资金流水（游标分页）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: currency, in: query, schema: { type: string }, description: 可选币种代码，不传查询所有币种 }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string }, description: 原样传递上一页 next_cursor，翻页时保持筛选条件不变 }
      responses:
        '200':
          description: 按 occurred_at、id 倒序；无 next_cursor 表示结束。历史冻结快照无法还原时为 null。
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/UnifiedLedgerEntry' } }
                  next_cursor: { type: string }
        '400': { description: 游标或分页参数无效 }
        '401': { description: 未登录 }
  /v1/currencies:
    get:
      tags: [Wallets]
      summary: 查询已启用的平台币种及精度
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 平台精度目录，不使用链上资产 decimals 解释钱包余额。
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Currency' } }
  /v1/admin/currencies:
    get:
      tags: [Admin]
      summary: 管理员查询全部平台币种（含禁用）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 币种目录
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Currency' } }
    post:
      tags: [Admin]
      summary: 管理员创建币种，代码与精度创建后不可修改
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CurrencyCreate' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Currency' }
        '400': { description: 参数无效 }
        '409': { description: 币种代码已存在 }
  /v1/admin/currencies/{code}:
    put:
      tags: [Admin]
      summary: 管理员更新币种名称、开关、注册初始化和排序（乐观锁）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CurrencyUpdate' }
      responses:
        '200':
          description: 更新成功，version 递增
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Currency' }
        '400': { description: 参数无效 }
        '409': { description: 版本过期或币种不存在，重新查询后提交 }
  /v1/activities/spins:
    get:
      tags: [Tasks]
      summary: 查询所有启用的转盘及其消耗和奖项配置
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 转盘列表。
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SpinConfig' } }
  /v1/activities/spins/{spinID}/play:
    post:
      tags: [Tasks]
      summary: 幂等参与指定转盘
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: spinID, in: path, required: true, schema: { type: string }, description: 转盘 UUID 或 code }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id]
              properties: { request_id: { type: string, minLength: 1 } }
      responses:
        '200': { description: 抽奖结果, content: { application/json: { schema: { $ref: '#/components/schemas/SpinResult' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/spins:
    get:
      tags: [Admin]
      summary: 查询全部转盘配置
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 转盘配置列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SpinConfig' } } } } }
    put:
      tags: [Admin]
      summary: 替换全部转盘及奖项配置
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, second_password]
              properties: { second_password: { type: string, format: password, writeOnly: true, minLength: 1 }, items: { type: array, minItems: 1, items: { $ref: '#/components/schemas/SpinConfig' } } }
      responses:
        '200': { description: 保存后的配置列表 }
  /v1/admin/monitor:
    get:
      tags: [Operations]
      summary: 后台实时投注与玩法轮次倒计时
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: user, in: query, schema: { type: string } }
        - { name: game_type, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
      responses:
        '200': { description: 当前接受中投注、各玩法当前轮次及服务端时间 }
  /v1/admin/monitor/bets:
    get:
      tags: [Operations]
      summary: 查询当前接受中的投注
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: user, in: query, schema: { type: string } }
        - { name: game_type, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200':
          description: 当前投注列表与服务端时间
          content:
            application/json:
              schema:
                type: object
                required: [server_time, items]
                properties:
                  server_time: { type: string, format: date-time }
                  items: { type: array, items: { $ref: '#/components/schemas/AdminCurrentBet' } }
  /v1/admin/monitor/rounds:
    get:
      tags: [Operations]
      summary: 查询各玩法当前轮次与区块倒计时
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 各玩法轮次、封盘和开奖时间 }
  /v1/admin/bets:
    get:
      tags: [Operations]
      summary: 跨玩家查询全部投注
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: user, in: query, schema: { type: string } }
        - { name: game_type, in: query, schema: { type: string } }
        - { name: currency, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [accepted, cancelled, won, lost, refunded] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: 投注明细列表
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminBet' } }
  /v1/admin/ledger:
    get:
      tags: [Operations]
      summary: 跨玩家统一查询资金和体力流水
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: user, in: query, schema: { type: string } }
        - { name: currency, in: query, schema: { type: string } }
        - { name: business_type, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: 按币种精度返回展示金额的统一流水
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminLedgerRecord' } }
  /v1/admin/refunds-clearances:
    get:
      tags: [Operations]
      summary: 查询投注退款和玩家清退/下分记录
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: user, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: 投注退款（含结算退款和主动取消）、USDT 提现和积分下分明细
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RefundClearanceRecord' } }
  /v1/admin/dashboard:
    get:
      tags: [Operations]
      summary: 玩家统计与排除虚拟账户的全局环境统计
      description: |
        global和players[].funds均按币种统计并返回decimals及展示金额字符串。删除players顶层错误的跨币种金额汇总字段；余额为当前可用加冻结，不是期末余额。统计排除虚拟账户。user只筛选players，不筛选global。from包含、to不包含；默认最近24小时。投注按下单时间，资金流水按发生时间统计。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: user, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
      responses:
        '200': { description: 按币种统计, content: { application/json: { schema: { $ref: '#/components/schemas/AdminDashboard' } } } }
  /v1/admin/users/{userID}/login-ips:
    get:
      tags: [Operations]
      summary: 查询玩家登录 IP 以及每个 IP 下的关联用户
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: IP 使用历史及关联用户 }
  /v1/admin/login-ips/{ip}/users:
    get:
      tags: [Operations]
      summary: 查询指定 IP 登录过的全部用户
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: ip, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 关联用户列表 }
  /v1/admin/virtual-accounts:
    post:
      tags: [Operations]
      summary: 创建可登录但不能下分的虚拟账户
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_name, display_name, password]
              properties:
                login_name: { type: string }
                display_name: { type: string }
                password: { type: string, minLength: 12 }
                initial_balances: { type: object, additionalProperties: { type: integer, format: int64 } }
      responses:
        '201': { description: 虚拟账户及默认挂机配置 }
  /v1/admin/virtual-accounts/{userID}/automation:
    put:
      tags: [Operations]
      summary: 配置虚拟账户自动挂机参数
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, currency, stake_minor, game_type_codes, interval_seconds]
              properties:
                enabled: { type: boolean }
                currency: { type: string }
                stake_minor: { type: integer, format: int64, minimum: 1 }
                game_type_codes: { type: array, items: { type: string } }
                interval_seconds: { type: integer, minimum: 3, maximum: 86400 }
      responses:
        '200': { description: 更新后的挂机配置 }
  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      summary: API 存活检查
      responses:
        '200':
          description: API 正常运行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      summary: PostgreSQL 就绪检查
      responses:
        '200':
          description: 依赖已就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/platform:
    get:
      tags: [Platform]
      operationId: getPlatform
      summary: 查询平台环境与领域列表
      responses:
        '200':
          description: 平台信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Platform'
  /v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: 注册玩家账号并签发访问令牌
      description: 邀请码为必填项。在单个事务中创建用户、密码凭证、player 角色、四种资产钱包及四种对应体力钱包，并建立直属推荐关系；注册完成即返回访问令牌。注册会写入审计日志。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              login_name: player-001
              display_name: 玩家一号
              password: correct-horse-battery
              invitation_code: "10001"
      responses:
        '201':
          description: 注册成功，返回访问令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/users/me:
    get:
      tags: [Auth]
      summary: 查询当前用户资料、邀请码和代理等级
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 当前用户资料。
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64, minimum: 100000, description: 公开数字用户 ID。 }
                  login_name: { type: string }
                  display_name: { type: string }
                  status: { type: string }
                  invitation_code: { type: integer, format: int64 }
                  agent_level: { type: integer, description: '0 表示不可邀请用户。' }
                  roles: { type: array, items: { type: string } }
                  created_at: { type: string, format: date-time }
                  avatar_url: { type: string }
                  secondary_password_set: { type: boolean, description: 是否已经设置二级密码；密码本身永不返回。 }
    put:
      tags: [Auth]
      summary: 修改当前用户头像和昵称
      description: avatar_url 只能为空字符串或当前用户本人已确认的 JPEG/PNG/WebP 上传记录 storage_key；不接受外链、签名上传 URL、公开头像 URL、未确认文件、PDF 或其他用户文件。即使只换头像也必须同时提交非空 display_name。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name, avatar_url]
              properties:
                display_name: { type: string, maxLength: 100 }
                avatar_url: { type: string, maxLength: 2048, description: 上传确认响应中的 upload.storage_key；传空字符串清除头像。 }
      responses:
        '200': { description: 修改成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/avatars/{userID}:
    get:
      tags: [Auth]
      summary: 获取用户公开头像
      description: 仅返回用户已确认并设置为头像的图片，可直接作为 img 的 src。
      parameters:
        - name: userID
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 100000 }
      responses:
        '200': { description: 头像图片内容 }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/users/me/password:
    put:
      tags: [Auth]
      summary: 修改当前用户密码
      description: 必须提交当前密码；成功后会撤销所有刷新令牌，需重新登录。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 1 }
      responses:
        '204': { description: 修改成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/users/me/secondary-password:
    put:
      tags: [Auth]
      summary: 设置或修改当前用户二级密码
      description: 先通过 GET /v1/users/me 的 secondary_password_set 判断流程。首次设置无需额外验证；已设置后修改必须验证旧二级密码。服务端以数据库中的实际设置状态为准，尚未设置时即使误带 current_secondary_password 也按首次设置处理。二级密码只保存 Argon2id 不可逆哈希，不会撤销当前登录会话。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [secondary_password]
              properties:
                current_secondary_password: { type: string, format: password, description: 修改时必填，用于验证旧二级密码。 }
                secondary_password: { type: string, format: password, minLength: 1 }
      responses:
        '204': { description: 设置成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: 已设置二级密码但未提供旧二级密码。 }
  /v1/users/me/secondary-password/verify:
    post:
      tags: [Auth]
      summary: 验证当前用户二级密码
      description: 仅返回本次校验结果，不签发后续敏感操作可消费的验证凭证，也不会自动保护提现等业务接口。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [secondary_password]
              properties:
                secondary_password: { type: string, format: password }
      responses:
        '204': { description: 验证通过 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: 尚未设置二级密码 }
  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 玩家端密码登录
      description: 仅允许具有 player 且不具有 admin/operator 的激活账号。后台账号即使同时保留 player 角色也会被拒绝。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login_name: player-001
              password: correct-horse-battery
      responses:
        '200':
          description: 登录成功，返回访问令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/auth/login:
    post:
      tags: [Auth, Admin]
      operationId: adminLogin
      summary: 管理后台密码登录
      description: 仅允许具有 admin 或 operator 角色的激活账号；玩家账号返回与凭证错误相同的 401，避免泄露账号角色。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，返回访问令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: 轮换玩家端刷新令牌
      description: 仅接受由玩家端登录或注册签发的刷新令牌，并再次校验账号仍是纯 player。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 刷新成功；原刷新令牌立即失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/auth/refresh:
    post:
      tags: [Auth, Admin]
      operationId: adminRefreshSession
      summary: 轮换管理后台刷新令牌
      description: 仅接受由管理后台登录签发的刷新令牌，并再次校验账号仍具有 admin/operator；角色已撤销时会使该会话失效。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 刷新成功；原刷新令牌立即失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 撤销刷新令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: 已退出；刷新令牌不可再使用。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/announcements:
    get:
      tags: [Platform]
      operationId: listAnnouncements
