              $ref: '#/components/schemas/ConsumeStaminaRequest'
            example:
              user_id: 4fb2b612-88cf-47cf-8312-cd76fa4d8869
              amount_minor: 10
              activity_id: lucky-draw-20260723
              remark: 参与抽奖活动
      responses:
        '200':
          description: 消耗结果（consumed=false 表示重复请求未重复扣减）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/tasks/bet-progress:
    get:
      tags: [Tasks]
      operationId: listBetTaskProgress
      summary: 查询当前用户中国时区今日投注任务进度
      description: 只有最终结算为 won 或 lost 的有效投注才按结算时所在的中国时区自然日累计。cancelled 和 refunded 投注不进入进度。玩家达标后必须在当天调用领取接口；第二天查询从零开始，旧日奖励不能补领。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 已启用的投注任务及完成、发奖状态。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BetTask'
  /v1/tasks/{taskID}/claim:
    post:
      tags: [Tasks]
