openapi: 3.1.0
info:
  title: Block Beast Platform API
  version: 0.1.0
  description: |
    Block Beast 的 HTTP 接口。金额均以货币最小单位（minor unit）表示，例如 USDT 的 2500 表示由客户端与游戏规则共同约定的 2500 最小单位。

    除健康检查、平台信息和认证接口外的业务接口均需携带 `Authorization: Bearer <access_token>` 访问令牌；登录或注册返回默认有效期 15 分钟的访问令牌和可轮换的刷新令牌。投注、钱包等账号级资源仅本人或具备 operator/admin 角色的账号可访问；轮次取消仅限 operator/admin。
  license:
    name: UNLICENSED
security: []
servers:
  - url: /
    description: Current deployment (same origin)
  - url: http://localhost:8080
    description: Local development
tags:
  - name: System
    description: 存活与依赖就绪检查。
  - name: Platform
    description: 平台元信息。
  - name: Auth
    description: 登录与访问令牌。
  - name: Rounds
    description: 游戏轮次查询与操作。
  - name: Bets
    description: 投注创建和查询。
  - name: Wallets
    description: 钱包余额查询。
  - name: Chain
    description: 链上充值回调与提现。
  - name: Admin
    description: 管理后台操作（积分/USDT/体力充值）。
  - name: Stamina
    description: 体力消耗与流水。
  - name: Tasks
    description: 每日任务（签到）。
  - name: Chat
    description: 公共聊天与客服会话。
  - name: Uploads
    description: S3 兼容对象存储直传与确认。
  - name: Leaderboards
    description: 已结算有效投注的 UTC 每日排行榜。
  - name: RedPackets
    description: 聊天室红包创建、领取和查询。
paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      summary: API 存活检查
      responses:
        '200':
          description: API 正常运行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      summary: PostgreSQL 就绪检查
      responses:
        '200':
          description: 依赖已就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/platform:
    get:
      tags: [Platform]
      operationId: getPlatform
      summary: 查询平台环境与领域列表
      responses:
        '200':
          description: 平台信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Platform'
  /v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: 注册玩家账号并签发访问令牌
      description: 邀请码为必填项。在单个事务中创建用户、密码凭证、player 角色和 USDT/POINTS/JADE/ORIGIN_STONE/STAMINA 五种零余额钱包，并建立直属推荐关系；注册完成即返回访问令牌。注册会写入审计日志。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              login_name: player-001
              display_name: 玩家一号
              password: correct-horse-battery
              invitation_code: "101"
      responses:
        '201':
          description: 注册成功，返回访问令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/users/me:
    get:
      tags: [Auth]
      summary: 查询当前用户资料、邀请码和代理等级
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 当前用户资料。
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64, minimum: 100000, description: 公开数字用户 ID。 }
                  login_name: { type: string }
                  display_name: { type: string }
                  status: { type: string }
                  invitation_code: { type: integer, format: int64 }
                  agent_level: { type: integer, description: '0 表示不可邀请用户。' }
                  roles: { type: array, items: { type: string } }
                  created_at: { type: string, format: date-time }
                  avatar_url: { type: string }
    put:
      tags: [Auth]
      summary: 修改当前用户头像和昵称
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name, avatar_url]
              properties:
                display_name: { type: string, maxLength: 100 }
                avatar_url: { type: string, maxLength: 2048 }
      responses:
        '200': { description: 修改成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/users/me/password:
    put:
      tags: [Auth]
      summary: 修改当前用户密码
      description: 必须提交当前密码；成功后会撤销所有刷新令牌，需重新登录。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 1 }
      responses:
        '204': { description: 修改成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/users/me/secondary-password:
    put:
      tags: [Auth]
      summary: 设置或修改当前用户二级密码
      description: 首次设置无需额外验证；已设置后修改只验证旧二级密码。二级密码只保存不可逆哈希。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [secondary_password]
              properties:
                current_secondary_password: { type: string, format: password, description: 修改时必填，用于验证旧二级密码。 }
                secondary_password: { type: string, format: password, minLength: 1 }
      responses:
        '204': { description: 设置成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: 已设置二级密码但未提供旧二级密码。 }
  /v1/users/me/secondary-password/verify:
    post:
      tags: [Auth]
      summary: 验证当前用户二级密码
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [secondary_password]
              properties:
                secondary_password: { type: string, format: password }
      responses:
        '204': { description: 验证通过 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: 尚未设置二级密码 }
  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 玩家端密码登录
      description: 仅允许具有 player 且不具有 admin/operator 的激活账号。后台账号即使同时保留 player 角色也会被拒绝。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login_name: player-001
              password: correct-horse-battery
      responses:
        '200':
          description: 登录成功，返回访问令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/auth/login:
    post:
      tags: [Auth, Admin]
      operationId: adminLogin
      summary: 管理后台密码登录
      description: 仅允许具有 admin 或 operator 角色的激活账号；玩家账号返回与凭证错误相同的 401，避免泄露账号角色。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，返回访问令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: 轮换玩家端刷新令牌
      description: 仅接受由玩家端登录或注册签发的刷新令牌，并再次校验账号仍是纯 player。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 刷新成功；原刷新令牌立即失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/auth/refresh:
    post:
      tags: [Auth, Admin]
      operationId: adminRefreshSession
      summary: 轮换管理后台刷新令牌
      description: 仅接受由管理后台登录签发的刷新令牌，并再次校验账号仍具有 admin/operator；角色已撤销时会使该会话失效。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 刷新成功；原刷新令牌立即失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 撤销刷新令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: 已退出；刷新令牌不可再使用。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/announcements:
    get:
      tags: [Platform]
      operationId: listAnnouncements
      summary: 查询当前生效的公告
      responses:
        '200':
          description: 已启用且处于展示时间窗口的公告。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Announcement'
  /v1/admin/announcements:
    get:
      tags: [Admin]
      operationId: adminListAnnouncements
      summary: 查询全部公告
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 公告列表。
    post:
      tags: [Admin]
      operationId: createAnnouncement
      summary: 创建公告
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementInput'
      responses:
        '201':
          description: 创建成功。
  /v1/admin/announcements/{announcementID}:
    put:
      tags: [Admin]
      operationId: updateAnnouncement
      summary: 更新公告
      security:
        - bearerAuth: []
      parameters:
        - name: announcementID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementInput'
      responses:
        '200':
          description: 更新成功。
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/audit-logs:
    get:
      tags: [Admin]
      operationId: listAuditLogs
      summary: 查询不可变审计日志（仅 admin）
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: actor_user_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 审计日志列表。
  /v1/game-rooms:
    get:
      tags: [Rounds]
      operationId: listGameRooms
      summary: 查询启用的游戏房间及房内玩法
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 动态房间列表。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameRoom'
  /v1/admin/game-rooms:
    get:
      tags: [Admin]
      operationId: adminListGameRooms
      summary: 查询全部游戏房间
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 房间列表。
    post:
      tags: [Admin]
      operationId: createGameRoom
      summary: 创建游戏房间
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameRoomInput'
      responses:
        '201':
          description: 创建成功。
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/game-rooms/{roomID}:
    put:
      tags: [Admin]
      operationId: updateGameRoom
      summary: 修改房间名称、分类、顺序或启停状态
      security:
        - bearerAuth: []
      parameters:
        - name: roomID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameRoomInput'
      responses:
        '200':
          description: 更新成功。
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/game-types:
    get:
      tags: [Admin]
      operationId: adminListGameTypes
      summary: 查询全部游戏玩法与结算规则
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 游戏玩法列表。
    post:
      tags: [Admin]
      operationId: createGameType
      summary: 创建游戏玩法
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameTypeInput'
      responses:
        '201':
          description: 创建成功。
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/game-types/{gameTypeID}:
    put:
      tags: [Admin]
      operationId: updateGameType
      summary: 修改或启停游戏玩法
      security:
        - bearerAuth: []
      parameters:
        - name: gameTypeID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameTypeInput'
      responses:
        '200':
          description: 更新成功。
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/rounds:
    get:
      tags: [Admin]
      operationId: adminListRounds
      summary: 查询运营轮次
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 轮次列表。
    post:
      tags: [Admin]
      operationId: createRound
      summary: 创建固定封盘时间的新轮次
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [game_type_id, bet_closes_at]
              properties:
                game_type_id:
                  type: string
                  format: uuid
                bet_closes_at:
                  type: string
                  format: date-time
      responses:
        '201':
          description: 轮次创建成功。
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/rounds:
    get:
      tags: [Rounds]
      operationId: listOpenRounds
      summary: 查询指定游戏的开放轮次
      security:
        - bearerAuth: []
      parameters:
        - name: game_type
          in: query
          required: true
          schema:
            type: string
          example: dice
        - name: limit
          in: query
          required: false
          description: 返回数量，默认 50，范围 1–100。
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: 开放轮次，按封盘时间升序。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Round'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/rounds/state:
    get:
      tags: [Rounds]
      operationId: getRoundState
      summary: 查询指定玩法的当前轮次和上一期开奖结果
      security:
        - bearerAuth: []
      parameters:
        - name: game_type
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 当前最早开放轮次、最近已结算轮次和服务端 UTC 时间；尚不存在时对应轮次字段为 null。客户端应用 server_time 校准本地时钟后计算倒计时。
          content:
            application/json:
              schema:
                type: object
                required: [current, previous, server_time]
                properties:
                  current:
                    oneOf:
                      - $ref: '#/components/schemas/Round'
                      - type: 'null'
                  previous:
                    oneOf:
                      - $ref: '#/components/schemas/Round'
                      - type: 'null'
                  server_time:
                    type: string
                    format: date-time
                    description: 服务端当前 UTC 时间，用于校准客户端倒计时。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/rounds/{roundID}:
    get:
      tags: [Rounds]
      operationId: getRound
      summary: 查询单个轮次
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoundID'
      responses:
        '200':
          description: 轮次详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Round'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/rounds/{roundID}/cancel:
    post:
      tags: [Rounds]
      operationId: cancelRound
      summary: 取消轮次并退款
      description: 仅开放或已封盘轮次可以取消。已接受的投注会退款；重复取消不会重复退款。仅限 operator/admin 角色调用，调用会写入审计日志。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoundID'
      responses:
        '200':
          description: 轮次已取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancellation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/bets:
    get:
      tags: [Bets]
      summary: 查询本人的投注列表
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [accepted, won, lost, refunded, cancelled] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: 投注列表。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Bet' }
    post:
      tags: [Bets]
      operationId: placeBet
      summary: 创建幂等投注
      description: 对同一 account_id 和 client_request_id 的重复请求会返回既有投注，不会再次扣款。仅本人或 operator/admin 可为指定账号投注。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceBetRequest'
            example:
              client_request_id: web-20260720-0001
              round_id: 8374209d-069a-4e6a-b1f2-c166e3b5ee52
              account_id: 4fb2b612-88cf-47cf-8312-cd76fa4d8869
              currency: USDT
              selection:
                color: red
              stake_minor: 2500
      responses:
        '201':
          description: 投注已接受，或同一幂等键对应的既有投注。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
