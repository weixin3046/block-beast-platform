    delete:
      tags: [Chat]
      summary: 幂等软删除聊天消息
      description: 用户可删除本人消息；admin/operator可删除有权访问房间内的消息。客服允许后台访问，私聊要求房间成员身份。复核当前账号状态及角色。状态、审计和chat.message.deleted事件同事务提交，重复删除不重复审计或通知。无请求体，不要求二级密码。
      security:
      - bearerAuth: []
