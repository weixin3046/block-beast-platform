                  description: HTTP 或 HTTPS 上游地址，无账号密码、查询参数或片段；更改前暂停通道
                protocol_key:
                  type: string
                  writeOnly: true
                  description: 24 或 32 字节协议密钥的 Base64；留空或省略保留
                scan_start_at:
                  type: string
                  format: date-time
                  description: 首次采集起点，不允许未来；已有进度后禁止向后移动
                second_password:
                  type: string
                  writeOnly: true
      responses:
