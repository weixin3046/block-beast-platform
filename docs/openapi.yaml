        title:
          type: string
          minLength: 1
          maxLength: 100
          description: 去首尾空白后非空，最多100个UTF-16单位
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: 纯文本，去首尾空白后非空，最多2000个UTF-16单位
        category:
          type: string
          maxLength: 50
          default: ''
          description: 去首尾空白后最多50个UTF-16单位
        sort:
          type: integer
          format: int64
          minimum: 0
          default: 0
        enabled:
          type: boolean
          default: false
    CustomerPhrase:
      type: object
