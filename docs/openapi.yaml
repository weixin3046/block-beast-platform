  "/v1/auth/register":
    post:
      tags:
      - Auth
      operationId: register
      summary: 注册玩家账号并签发访问令牌
      description: 邀请码为必填项。在单个事务中创建用户、密码凭证、player 角色、四种资产钱包及四种对应体力钱包，并建立直属推荐关系；注册完成即返回访问令牌。注册会写入审计日志。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
            example:
              login_name: player-001
              display_name: 玩家一号
              password: correct-horse-battery
              invitation_code: '10001'
      responses:
        '201':
          description: 注册成功，返回访问令牌。
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResult"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '409':
          "$ref": "#/components/responses/Conflict"
        '503':
          "$ref": "#/components/responses/Unavailable"
  "/v1/users/me":
    get:
      tags:
      - Auth
      summary: 查询当前用户资料、邀请码和代理等级
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 当前用户资料。
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                    minimum: 10001
                    description: 公开数字用户 ID。
                  login_name:
                    type: string
                  display_name:
                    type: string
                  status:
                    type: string
                  invitation_code:
                    type: integer
                    format: int64
                  agent_level:
                    type: integer
                    description: 0 表示不可邀请用户。
                  roles:
                    type: array
                    items:
                      type: string
                  created_at:
                    type: string
                    format: date-time
                  avatar_url:
                    type: string
                  secondary_password_set:
                    type: boolean
                    description: 是否已经设置二级密码；密码本身永不返回。
    put:
      tags:
      - Auth
      summary: 修改当前用户头像和昵称
      description: avatar_url 只能为空字符串或当前用户本人已确认的 JPEG/PNG/WebP 上传记录 storage_key；不接受外链、签名上传
        URL、公开头像 URL、未确认文件、PDF 或其他用户文件。即使只换头像也必须同时提交非空 display_name。
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - display_name
              - avatar_url
              properties:
                display_name:
                  type: string
                  maxLength: 100
                avatar_url:
                  type: string
                  maxLength: 2048
                  description: 上传确认响应中的 upload.storage_key；传空字符串清除头像。
      responses:
        '200':
          description: 修改成功
        '400':
          "$ref": "#/components/responses/BadRequest"
  "/v1/avatars/{userID}":
    get:
      tags:
      - Auth
      summary: 获取用户公开头像
