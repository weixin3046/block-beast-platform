      tags: [Admin, Chain]
      summary: 拒绝 USDT 提现并解冻余额
      security: [{ bearerAuth: [] }]
      parameters:
        - name: withdrawalID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: 已拒绝。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Withdrawal' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/users:
    get:
      tags: [Admin]
      summary: 后台查询用户
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: user_type, in: query, schema: { type: string, enum: [real, virtual] } }
        - { name: currency, in: query, schema: { type: string }, description: 逗号分隔或重复参数，如USDT,JADE；返回对应钱包，任一币种命中余额条件即匹配用户 }
        - { name: available_min, in: query, schema: { type: string }, description: 展示单位的非负金额，不是minor }
        - { name: available_max, in: query, schema: { type: string }, description: 展示单位的非负金额，不跨币种相加 }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
        - name: status
          in: query
          schema: { type: string, enum: [active, disabled, bet_banned] }
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 用户列表，包含可用于后台操作的用户 ID。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminUser' }
  /v1/admin/users/{userID}/agent-level:
    put:
      tags: [Admin]
      summary: 设置用户代理等级；设置后其邀请码才可用于注册邀请
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userID
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 100000 }
          description: 公开数字用户 ID，不是内部 UUID。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_level]
              properties:
                agent_level: { type: integer, minimum: 1, maximum: 6 }
      responses:
        '200': { description: 已更新 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/users/{userID}/status:
    put:
      tags: [Admin]
      summary: 修改用户状态
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userID
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 100000 }
          description: 公开数字用户 ID，不是内部 UUID。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled, bet_banned] }
      responses:
        '200': { description: 已更新 }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/point-withdrawals:
    post:
      tags: [Wallets]
      summary: 幂等申请积分下分
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PointWithdrawalRequest' }
      responses:
        '201':
          description: 已冻结积分并创建申请；重试返回原申请。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PointWithdrawal' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Wallets]
      summary: 查询本人的积分下分申请
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [requested, approved, rejected] } }
        - { name: account_id, in: query, schema: { type: string, pattern: '^[0-9]+$' } }
      responses:
        '200': { description: 积分下分列表 }
  /v1/admin/point-withdrawals:
    get:
      tags: [Admin, Wallets]
      summary: 后台查询积分下分申请
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [requested, approved, rejected] } }
      responses:
        '200': { description: 积分下分列表 }
  /v1/admin/point-withdrawals/{withdrawalID}/review:
    post:
      tags: [Admin, Wallets]
      summary: 审核积分下分申请
      security: [{ bearerAuth: [] }]
      parameters:
        - name: withdrawalID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved: { type: boolean }
      responses:
        '200': { description: 审核完成 }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RoundID:
      name: roundID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BetID:
      name: betID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccountID:
      name: accountID
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 100000
        description: 公开数字用户 ID。
    Limit:
      name: limit
      in: query
      required: false
      description: 返回数量，默认 50，范围 1–100。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      description: 分页偏移，默认 0。
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    BadRequest:
      description: 请求参数或 JSON 请求体无效。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 缺少访问令牌，或令牌无效、已过期、凭证错误。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 已认证但角色不足、资源属于其他账号，或账号未激活。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 请求的资源不存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 当前资源状态不允许该操作，或余额不足。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 同一登录名在统计窗口内失败次数过多，账号已被临时锁定。
      headers:
        Retry-After:
          description: 客户端再次尝试前至少等待的秒数。
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: 服务依赖尚未就绪或对应能力未启用。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    CurrencyStatistic:
      type: object
      required: [currency, decimals, bet_count]
      properties:
        currency: { type: string }
        decimals: { type: integer }
        bet_count: { type: integer, format: int64 }
        stake_minor: { type: integer, format: int64 }
        stake: { type: string, description: 按decimals格式化的展示金额 }
        payout_minor: { type: integer, format: int64 }
        payout: { type: string, description: 按decimals格式化的展示金额 }
        deposit_minor: { type: integer, format: int64 }
        deposit: { type: string, description: 按decimals格式化的展示金额 }
        credit_minor: { type: integer, format: int64 }
        credit: { type: string, description: 按decimals格式化的展示金额 }
        clearance_minor: { type: integer, format: int64 }
        clearance: { type: string, description: 按decimals格式化的展示金额 }
        gift_minor: { type: integer, format: int64 }
        gift: { type: string, description: 按decimals格式化的展示金额 }
        penalty_minor: { type: integer, format: int64 }
        penalty: { type: string, description: 按decimals格式化的展示金额 }
        balance_minor: { type: integer, format: int64 }
        balance: { type: string, description: 按decimals格式化的展示金额 }
    AdminUserBalance:
      type: object
      properties:
        currency: { type: string }
        decimals: { type: integer }
        available_minor: { type: integer, format: int64 }
        frozen_minor: { type: integer, format: int64 }
        available: { type: string }
        frozen: { type: string }
    AdminDashboard:
      type: object
      required: [server_time, players, global]
      properties:
        server_time: { type: string, format: date-time }
        global: { type: array, items: { $ref: '#/components/schemas/CurrencyStatistic' } }
        players:
          type: array
          items:
            type: object
            required: [user_id, login_name, display_name, bet_count, funds]
            properties:
              user_id: { type: integer, format: int64 }
              login_name: { type: string }
              display_name: { type: string }
              bet_count: { type: integer, format: int64 }
              funds: { type: array, items: { $ref: '#/components/schemas/CurrencyStatistic' } }
    CustomerPhraseInput:
      type: object
      additionalProperties: false
      required: [title, content]
      properties:
        title: { type: string, minLength: 1, maxLength: 100, description: 去首尾空白后非空，最多100个UTF-16单位 }
        content: { type: string, minLength: 1, maxLength: 2000, description: 纯文本，去首尾空白后非空，最多2000个UTF-16单位 }
        category: { type: string, maxLength: 50, default: '', description: 去首尾空白后最多50个UTF-16单位 }
        sort: { type: integer, format: int64, minimum: 0, default: 0 }
        enabled: { type: boolean, default: false }
    CustomerPhraseCreate:
      type: object
      additionalProperties: false
      required: [title, content, request_id]
      properties:
        request_id: { type: string, format: uuid, description: 创建幂等键，重试复用，不同操作生成新UUID }
        title: { type: string, minLength: 1, maxLength: 100, description: 去首尾空白后非空，最多100个UTF-16单位 }
        content: { type: string, minLength: 1, maxLength: 2000, description: 纯文本，去首尾空白后非空，最多2000个UTF-16单位 }
        category: { type: string, maxLength: 50, default: '', description: 去首尾空白后最多50个UTF-16单位 }
        sort: { type: integer, format: int64, minimum: 0, default: 0 }
        enabled: { type: boolean, default: false }
    CustomerPhrase:
      type: object
      additionalProperties: false
      required: [id, title, content, category, sort, enabled, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, minimum: 1, description: 自增话术ID，不是用户ID }
        title: { type: string, minLength: 1, maxLength: 100, description: 去首尾空白后非空，最多100个UTF-16单位 }
        content: { type: string, minLength: 1, maxLength: 2000, description: 纯文本，去首尾空白后非空，最多2000个UTF-16单位 }
        category: { type: string, maxLength: 50, default: '', description: 去首尾空白后最多50个UTF-16单位 }
        sort: { type: integer, format: int64, minimum: 0, default: 0 }
        enabled: { type: boolean, default: false }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PointWithdrawalRequest:
      type: object
      required: [request_id, amount_minor]
      properties:
        account_id: { type: string, pattern: '^[0-9]+$', description: 可省略，正常登录取 Token 主体；仅鉴权关闭时使用公开用户 ID 字符串 }
        request_id: { type: string, minLength: 1 }
        amount_minor: { type: integer, format: int64, minimum: 1, description: POINTS 最小单位整数，1.5 分传 1500，不使用 amount 字段 }
        remark: { type: string }
    PointWithdrawal:
      type: object
      required: [id, user_id, client_request_id, amount_minor, status, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: integer, format: int64, minimum: 100000 }
        client_request_id: { type: string }
        amount_minor: { type: integer, format: int64 }
        status: { type: string, enum: [requested, approved, rejected] }
        created_at: { type: string, format: date-time }
    CommissionGrantRequest:
      type: object
      required: [request_id, currency, amount_minor]
      properties:
        request_id: { type: string, minLength: 1 }
        currency: { type: string }
        amount_minor: { type: integer, format: int64, minimum: 1 }
        remark: { type: string }
    LeaderboardRewardRule:
      type: object
      additionalProperties: false
      required: [rank_from, rank_to, reward_currency, reward_minor, enabled]
      properties:
        rank_from: { type: integer, minimum: 1 }
        rank_to: { type: integer, minimum: 1, description: 不小于 rank_from，档位不得重叠且按名次递增排列 }
        reward_currency: { type: string, minLength: 1 }
        reward_minor: { type: integer, format: int64, minimum: 1 }
        enabled: { type: boolean }
    LeaderboardRewardRuleSet:
      type: object
      additionalProperties: false
      required: [period_type, currency, version, rules]
      properties:
        period_type: { type: string, enum: [daily, weekly] }
        currency: { type: string, minLength: 1, description: 排行币种 }
        version: { type: integer, format: int64, minimum: 0, description: 查询返回的版本号，初次配置为 0，不是 expected_version }
        rules: { type: array, items: { $ref: '#/components/schemas/LeaderboardRewardRule' }, description: 完整替换档位，空数组清空奖励配置 }
    LeaderboardRewardRuleSetUpdate:
      type: object
      additionalProperties: false
      required: [period_type, currency, version, rules, second_password]
      properties:
        second_password: { type: string, format: password, writeOnly: true, minLength: 1 }
        period_type: { type: string, enum: [daily, weekly] }
        currency: { type: string, minLength: 1, description: 排行币种 }
        version: { type: integer, format: int64, minimum: 0, description: 查询返回的版本号，初次配置为 0，不是 expected_version }
        rules: { type: array, items: { $ref: '#/components/schemas/LeaderboardRewardRule' }, description: 完整替换档位，空数组清空奖励配置 }
    UnifiedLedgerEntry:
      type: object
      required: [id, currency, decimals, business_type, business_id, entry_type, amount_minor, amount, available_delta_minor, frozen_delta_minor, available_after_minor, frozen_after_minor, available_after, frozen_after, remark, occurred_at]
      properties:
        id: { type: string, format: uuid }
        currency: { type: string }
        decimals: { type: integer }
        business_type: { type: string }
        business_id: { type: string }
        entry_type: { type: string }
        amount_minor: { type: integer, format: int64, description: 业务金额，不一定等于可用余额变化；确认提现只扣冻结余额 }
        amount: { type: string, description: 已格式化的业务金额 }
        available_delta_minor: { type: integer, format: int64 }
        frozen_delta_minor: { type: integer, format: int64 }
        available_after_minor: { type: integer, format: int64 }
        frozen_after_minor: { type: [integer, 'null'], format: int64 }
        available_after: { type: string }
        frozen_after: { type: [string, 'null'] }
        remark: { type: string }
        occurred_at: { type: string, format: date-time }
    CurrencyCreate:
      type: object
      additionalProperties: false
      required: [code, name, decimals, category, enabled, create_on_registration, sort_order]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$' }
        name: { type: string, minLength: 1 }
        decimals: { type: integer, minimum: 0, maximum: 18 }
        category: { type: string, enum: [token, points, stamina, custom] }
        enabled: { type: boolean }
        create_on_registration: { type: boolean }
        sort_order: { type: integer }
    CurrencyUpdate:
      type: object
      additionalProperties: false
      required: [name, enabled, create_on_registration, sort_order, version]
      properties:
        name: { type: string, minLength: 1 }
        enabled: { type: boolean }
        create_on_registration: { type: boolean }
        sort_order: { type: integer }
        version: { type: integer, format: int64, minimum: 1 }
    Currency:
      type: object
      required: [id, code, name, decimals, category, enabled, create_on_registration, sort_order, version]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        decimals: { type: integer, minimum: 0, maximum: 18 }
        category: { type: string, enum: [token, points, stamina, custom] }
        enabled: { type: boolean }
        create_on_registration: { type: boolean }
        sort_order: { type: integer }
        version: { type: integer, format: int64 }
    AdminUser:
      type: object
      required: [id, login_name, display_name, status, created_at]
      properties:
        is_virtual: { type: boolean }
        chat_muted: { type: boolean }
        balances: { type: array, items: { $ref: '#/components/schemas/AdminUserBalance' } }
        invitation_code: { type: integer, format: int64, description: 邀请码，与公开用户ID不同 }
        agent_level: { type: integer, description: 代理等级，0表示非代理 }
        parent_user_id: { type: integer, format: int64, description: 用户列表返回直接上级公开ID，无上级省略 }
        parent_display_name: { type: string }
        parent_invitation_code: { type: integer, format: int64 }
        avatar_url: { type: string, description: 未设置或列表未加载时为空字符串 }
        roles: { type: array, items: { type: string }, description: 仅加载角色的用户详情返回 }
        secondary_password_set: { type: boolean, description: 仅本人详情返回是否设置二级密码 }
        id:
          type: integer
          format: int64
          minimum: 100000
          description: 面向前端和后台的数字用户 ID；UUID 仅用于内部关联。
        login_name: { type: string }
        display_name: { type: string }
        status: { type: string, enum: [active, disabled, bet_banned] }
        created_at: { type: string, format: date-time }
    PlatformConfig:
      type: object
      required: [key, value, visibility, version, updated_at]
      properties:
        key: { type: string }
        value: {}
        visibility: { type: string, enum: [public, internal] }
        version: { type: integer, format: int64, minimum: 1 }
        updated_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
    Role:
      type: object
      required: [code, description]
      properties:
        code: { type: string, enum: [player, operator, admin] }
        description: { type: string }
    RoleAssignment:
      type: object
      required: [user_id, roles]
      properties:
        user_id: { type: integer, format: int64, minimum: 100000 }
        roles:
          type: array
          items: { type: string, enum: [player, operator, admin] }
    RedPacket:
      type: object
      required: [id, room_id, sender_user_id, client_request_id, currency, greeting, total_minor, remaining_minor, packet_count, claimed_count, status, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        room_id: { type: string, format: uuid }
        sender_user_id: { type: integer, format: int64, minimum: 100000 }
        client_request_id: { type: string }
        currency: { type: string, enum: [USDT, POINTS] }
        greeting: { type: string }
        total_minor: { type: integer, format: int64 }
        remaining_minor: { type: integer, format: int64 }
        packet_count: { type: integer }
        claimed_count: { type: integer }
        status: { type: string, enum: [active, exhausted, refunded] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    RedPacketClaim:
      type: object
      required: [id, red_packet_id, user_id, currency, amount_minor, claimed_at]
      properties:
        id: { type: string, format: uuid }
        red_packet_id: { type: string, format: uuid }
        user_id: { type: integer, format: int64, minimum: 100000 }
        currency: { type: string, enum: [USDT, POINTS] }
        amount_minor: { type: integer, format: int64, minimum: 1 }
        claimed_at: { type: string, format: date-time }
    LeaderboardBoard:
      type: object
      required: [period, period_type, currency, starts_at, ends_at, status, items]
      properties:
        decimals: { type: integer }
        period: { type: string, enum: [today, yesterday, this_week, last_week] }
        period_type: { type: string, enum: [daily, weekly] }
        currency: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        status: { type: string, enum: [running, frozen] }
        refreshed_at: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [rank, user_id, display_name, avatar_url, is_virtual, effective_stake_minor]
            properties:
              rank: { type: integer, minimum: 1 }
              user_id: { type: integer, format: int64, minimum: 100000 }
              display_name: { type: string }
              avatar_url: { type: string }
              is_virtual: { type: boolean }
              total_bet: { type: string, description: 已格式化的有效投注总额 }
              total_payout_minor: { type: integer, format: int64, description: 周期内有效投注的含本金派奖；历史未保存时省略 }
              total_payout: { type: string }
              net_win_minor: { type: integer, format: int64, description: 派奖减有效投注本金 }
              net_win: { type: string }
              available_minor: { type: integer, format: int64, description: 榜单刷新时可用余额快照，仅本人或后台可见，历史未知时省略 }
              available: { type: string }
              first_bet_at: { type: string, format: date-time, description: 周期内首笔有效投注下单时间 }
              effective_stake_minor: { type: integer, format: int64 }
              reward:
                type: object
                properties:
                  currency: { type: string }
                  amount_minor: { type: integer, format: int64 }
    Upload:
      type: object
      required: [id, owner_user_id, storage_key, content_type, size_bytes, status, created_at]
      properties:
        id: { type: string, format: uuid }
        owner_user_id: { type: integer, format: int64, minimum: 100000 }
        storage_key: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        status: { type: string, enum: [pending, confirmed, expired] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    UploadAuthorization:
      type: object
      required: [upload, method, url, headers, expires_at]
      properties:
        upload: { $ref: '#/components/schemas/Upload' }
        method: { type: string, const: PUT }
        url: { type: string, format: uri-reference }
        headers:
          type: object
          additionalProperties: { type: string }
        expires_at: { type: string, format: date-time }
        requires_auth:
          type: boolean
          description: 为 true 时上传 URL 是站内接口，必须附带当前 Bearer Token。
    ChatRoom:
      type: object
      required: [id, type, created_at]
      properties:
        customer_user_id: { type: integer, format: int64, description: 客服会话列表中的玩家公开ID }
        customer_display_name: { type: string }
        customer_invitation_code: { type: integer, format: int64 }
        id: { type: string, format: uuid }
        type: { type: string, enum: [global, game, customer_service, direct] }
        service_type:
          type: string
          enum: [deposit, withdrawal]
          description: 仅 `customer_service` 房间存在；deposit 为上分客服，withdrawal 为下分客服。
        created_at: { type: string, format: date-time }
    CustomerServiceRooms:
      type: object
      required: [deposit, withdrawal]
      properties:
        deposit:
          allOf: [{ $ref: '#/components/schemas/ChatRoom' }]
          description: 上分（充值）客服房间。
        withdrawal:
          allOf: [{ $ref: '#/components/schemas/ChatRoom' }]
          description: 下分（提现）客服房间。
    ChatMessage:
      type: object
      required: [id, room_id, body, status, created_at]
      properties:
        id: { type: string, format: uuid }
        room_id: { type: string, format: uuid }
        sender:
          allOf: [{ $ref: '#/components/schemas/ChatMessageSender' }]
          description: 发送者摘要；系统消息可以不存在。
        body: { type: string }
        status: { type: string, enum: [visible, hidden, deleted] }
        client_request_id: { type: string }
        created_at: { type: string, format: date-time }
    ChatMessageSender:
      type: object
      required: [user_id, display_name, avatar_url]
      properties:
        user_id:
          type: integer
          format: int64
          minimum: 100000
          description: 对外公开的数字用户 ID，不是内部 UUID。
        display_name: { type: string }
        avatar_url:
          type: string
          description: 头像 URL；空字符串表示未设置，站内 `/v1/avatars/{userID}` 地址可直接显示。
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    DepositWebhookRequest:
      type: object
      required: [event, id, chainTokenId, address, amount, txHash, txStatus]
      properties:
        event: { type: string, enum: [recharge] }
        id: { type: integer, format: int64, description: PQPA 充值事件 ID }
        applicationId: { type: integer, format: int64 }
        chainId: { type: integer, format: int64 }
        chainTokenId: { type: integer, format: int64 }
        address:
          type: string
          description: 平台分配给用户的充值地址。
        amount: { type: string, example: '100.00' }
        txHash: { type: string }
        blockHeight: { type: integer, format: int64 }
        txStatus: { type: string, example: SETTLED }
    DepositResult:
      type: object
      required: [deposit_id, status, credited]
      properties:
        deposit_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [credited]
        credited:
          type: boolean
          description: false 表示重复回调，未重复入账。
    WithdrawalRequest:
      type: object
      additionalProperties: false
      required: [client_request_id, destination_address, chain_code, currency, amount_minor]
      properties:
        account_id:
          type: string
          pattern: '^[0-9]+$'
          description: 可省略；正常登录取 Token 主体，仅鉴权关闭的本地模式使用此公开用户 ID 字符串。
        client_request_id:
          type: string
          minLength: 1
          description: 客户端生成的幂等键；同一用户下必须唯一。
        destination_address:
          type: string
          minLength: 8
          maxLength: 256
          description: TRON 与 EVM 网络执行链格式校验；其他网络执行长度及空白/控制字符校验。
        destination_memo:
          type: string
          maxLength: 256
          description: 目标链要求 Memo/Tag 时填写。
        chain_code:
          type: string
          example: POLYGON
        currency:
          type: string
          example: USDT
        amount_minor:
          type: integer
          format: int64
          minimum: 1
    Withdrawal:
      type: object
      required: [withdrawal_id, client_request_id, destination_address, chain_code, currency, amount_minor, status, created_at]
      properties:
        withdrawal_id:
          type: string
          format: uuid
        client_request_id:
          type: string
        destination_address:
          type: string
        destination_memo:
          type: string
        chain_code:
          type: string
        currency:
          type: string
        amount_minor:
          type: integer
          format: int64
        status:
          type: string
          enum: [requested, approved, broadcasted, confirmed, failed, cancelled]
        created_at:
          type: string
          format: date-time
        provider_order_id:
          type: string
        tx_hash:
          type: string
        failure_reason:
          type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [login_name, password, invitation_code]
      properties:
        login_name:
          type: string
          pattern: '^[A-Za-z0-9_-]{3,32}$'
          description: 3–32 位字母、数字、连字符或下划线。
        display_name:
          type: string
          description: 展示名，缺省与登录名相同。
        password:
          type: string
          format: password
          description: 密码。
        invitation_code:
          type: string
          pattern: '^[0-9]+$'
          description: 必填。邀请人的数字邀请码，从 10001 起分配。
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login_name, password]
      properties:
        login_name:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          format: password
    LoginResult:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user_id, roles]
      properties:
        access_token:
          type: string
          description: HS256 签发的 JWT 访问令牌。
        refresh_token:
          type: string
          description: 仅返回给客户端的随机令牌；服务端只保存 SHA-256 摘要。
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          format: int64
          description: 令牌有效期（秒）。
          example: 900
        user_id:
          type: integer
          format: int64
          minimum: 100000
        roles:
          type: array
          items:
            type: string
            enum: [player, operator, admin]
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
    AnnouncementInput:
      type: object
      additionalProperties: false
      required: [title, body, enabled]
      properties:
        title:
          type: string
        body:
          type: string
        enabled:
          type: boolean
        starts_at:
          type: [string, 'null']
          format: date-time
        ends_at:
          type: [string, 'null']
          format: date-time
    Announcement:
      allOf:
        - $ref: '#/components/schemas/AnnouncementInput'
        - type: object
          required: [id, created_at]
          properties:
            id:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time
    GameTypeInput:
      type: object
      additionalProperties: false
      required: [name, enabled, rules]
      properties:
        room_id:
          type: string
          format: uuid
        name:
          type: string
        mode:
          type: string
          enum: [guess, bigsmall, dodge]
        block_interval:
          type: integer
          minimum: 1
        close_before_seconds:
          type: integer
          minimum: 1
          maximum: 59
          default: 3
          description: 当前玩法在开奖前多少秒封盘，哈希和 K 线玩法均可独立配置。
        enabled:
          type: boolean
        rules:
          type: object
          required: [outcomes, payout_multiplier]
          properties:
            outcomes:
              type: array
              minItems: 1
              items:
                type: string
            payout_multiplier:
              type: integer
              minimum: 1
            payout_divisor:
              type: integer
              minimum: 1
              description: 房间玩法固定为 100，因此 194 表示 1.94 倍。
            bet_limits:
              type: object
              additionalProperties:
                type: object
                required: [min_stake_minor, max_stake_minor]
                properties:
                  min_stake_minor:
                    type: integer
                    minimum: 0
                  max_stake_minor:
                    type: integer
                    minimum: 1
            match_field:
              type: string
            result_count:
              type: integer
              minimum: 1
            source:
              type: string
              enum: [tron_hash, okx_kline]
            extras:
              type: object
            dodge_mode:
              type: boolean
    GameRoomInput:
      type: object
      additionalProperties: false
      required: [name, game_kind, enabled, sort_order]
      properties:
        name:
          type: string
        game_kind:
          type: string
          enum: [hash, kline]
          description: 房间游戏分类；进入 K 线房间后再选择 BTC 或 ETH。
        enabled:
          type: boolean
        sort_order:
          type: integer
    GameRoom:
      allOf:
        - $ref: '#/components/schemas/GameRoomInput'
        - type: object
          required: [id, game_types, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
              description: 后端自动生成的内部标识，前端不得要求运营人员填写。
            game_types:
              type: array
              items:
                type: object
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    HashCurrencyConfig:
      type: object
      additionalProperties: false
      required: [currency, guess_multiplier, guess_divisor, dodge_multiplier, dodge_divisor, road_multiplier, road_divisor, guess_max_stake_minor, dodge_max_stake_minor, road_max_stake_minor, min_stake_minor]
      properties:
        currency: { type: string, minLength: 1 }
        guess_multiplier: { type: integer, format: int64, minimum: 1, description: 定点整数倍率，例如 9350/1000 = 9.35。 }
        guess_divisor: { type: integer, format: int64, minimum: 1 }
        dodge_multiplier: { type: integer, format: int64, minimum: 1 }
        dodge_divisor: { type: integer, format: int64, minimum: 1 }
        road_multiplier: { type: integer, format: int64, minimum: 1 }
        road_divisor: { type: integer, format: int64, minimum: 1 }
        guess_max_stake_minor: { type: integer, format: int64, minimum: 1, description: 竞猜累计上限，使用币种最小单位。 }
        dodge_max_stake_minor: { type: integer, format: int64, minimum: 1, description: 躲避累计上限，使用币种最小单位。 }
        road_max_stake_minor: { type: integer, format: int64, minimum: 1, description: 上下路累计上限，使用币种最小单位。 }
        min_stake_minor: { type: integer, format: int64, minimum: 1, description: 单笔最低投注，且不得高于任一玩法累计上限。 }
    HashRoomConfig:
      type: object
      additionalProperties: false
      required: [id, code, name, enabled, sort_order, game_types, currency_configs]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string, minLength: 1 }
        enabled: { type: boolean }
        sort_order: { type: integer }
        game_types:
          type: array
          description: 固定包含相同的 9、13、17、19、23、29 区块玩法。
          items: { type: object }
        currency_configs:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/HashCurrencyConfig' }
    HashConfig:
      type: object
      additionalProperties: false
      required: [version, server_time, rooms]
      properties:
        version: { type: integer, format: int64, minimum: 1 }
        server_time: { type: string, format: date-time }
        rooms:
          type: array
          items: { $ref: '#/components/schemas/HashRoomConfig' }
    HashConfigUpdate:
      type: object
      additionalProperties: false
      required: [expected_version, rooms, second_password]
      properties:
        second_password: { type: string, format: password, writeOnly: true, minLength: 1 }
        expected_version: { type: integer, format: int64, minimum: 1 }
        rooms:
          type: array
          minItems: 6
          maxItems: 6
          items: { $ref: '#/components/schemas/HashRoomConfig' }
    HashTrend:
      type: object
      additionalProperties: false
      required: [game_type, server_time, items, summary]
      properties:
        game_type: { type: string, enum: [hash_9, hash_13, hash_17, hash_19, hash_23, hash_29] }
        server_time: { type: string, format: date-time }
        items:
          type: array
          description: 按目标区块高度倒序排列。
          items:
            type: object
            additionalProperties: false
            required: [sequence, digit, size, parity, settled_at]
            properties:
              sequence: { type: integer, format: int64, description: 目标区块高度，同时也是期号。 }
              digit: { type: integer, minimum: 0, maximum: 9 }
              size: { type: string, enum: [big, small] }
              parity: { type: string, enum: [odd, even] }
              settled_at: { type: string, format: date-time }
        summary:
          type: object
          additionalProperties: false
          required: [digit_omissions, size_streak, parity_streak]
          properties:
            digit_omissions:
              type: object
              description: 每个数字距离最近一次出现已经经过的期数；未在当前窗口出现时等于 items 数量。
              additionalProperties: { type: integer, minimum: 0 }
            size_streak: { $ref: '#/components/schemas/HashTrendStreak' }
            parity_streak: { $ref: '#/components/schemas/HashTrendStreak' }
    HashTrendStreak:
      type: object
      additionalProperties: false
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer, minimum: 0 }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: 简体中文提示，可直接展示；不要按提示文本判断业务分支。
          example: 轮次不存在
    Platform:
      type: object
      required: [environment, domains]
      properties:
        environment:
          type: string
          example: development
        domains:
          type: array
          items:
            type: string
    Round:
      type: object
      required: [round_id, game_type, sequence, status, bet_closes_at, result_at]
      properties:
        round_id:
          type: string
          format: uuid
        game_type:
          type: string
          example: dice
        sequence:
          type: integer
          format: int64
        status:
          type: string
          enum: [open, closed, settling, settled, cancelled]
        bet_closes_at:
          type: string
          format: date-time
        result_at:
          type: string
          format: date-time
          description: 目标结果预计可用时间；哈希玩法比 bet_closes_at 晚 5 秒。目标区块实际到达后立即结算，不增加人为延迟。
        settled_at:
          type: string
          format: date-time
        outcome:
          type: array
          items:
            type: string
    PlaceBetRequest:
      type: object
      additionalProperties: false
      required: [client_request_id, round_id, account_id, currency, selection, stake_minor]
      properties:
        client_request_id:
          type: string
          minLength: 1
          description: 客户端生成的幂等键；同一用户下必须唯一。
        round_id:
          type: string
          format: uuid
        account_id:
          type: integer
          format: int64
          minimum: 100000
          description: 玩家公开数字 ID；必须与当前访问令牌对应的账号一致。
        currency:
          type: string
          minLength: 1
          example: USDT
        game_room_id:
          type: string
          format: uuid
          description: 共享哈希轮次必填，表示六个赔率房间中的一个；普通玩法省略。
        play_mode:
          type: string
          enum: [guess, dodge, road]
          description: 共享哈希轮次必填。guess/dodge 的 pick 为 0–9，road 的 pick 为 big/small/odd/even。
        selection:
          description: 玩法定义的有效 JSON 选择值。
        stake_minor:
          type: integer
          format: int64
          minimum: 1
    Bet:
      type: object
      required: [bet_id, client_request_id, round_id, account_id, game_type, game_name, round_sequence, currency, selection, stake_minor, payout_multiplier, payout_divisor, payout_rate, status, payout_minor, placed_at]
      properties:
        decimals: { type: integer }
        stake: { type: string, description: 投注额展示值 }
        payout: { type: string, description: 派奖额展示值 }
        bet_id:
          type: string
          format: uuid
        client_request_id:
          type: string
        round_id:
          type: string
          format: uuid
        account_id:
          type: integer
          format: int64
          minimum: 100000
        game_type: { type: string, example: hash_9 }
        game_name: { type: string, example: 9区块 }
        round_sequence: { type: integer, format: int64 }
        currency:
          type: string
        game_room_id:
          type: string
          format: uuid
        game_room_code: { type: string, example: hash_rate_1940 }
        game_room_name: { type: string, example: 高额返水 1.94 倍 }
        play_mode:
          type: string
          enum: [guess, dodge, road]
        selection: {}
        stake_minor:
          type: integer
          format: int64
        payout_multiplier: { type: integer, format: int64, description: 投注成交时保存的赔率分子快照。 }
        payout_divisor: { type: integer, format: int64, description: 投注成交时保存的赔率分母快照。 }
        payout_rate: { type: string, example: '1.94', description: 由赔率快照精确格式化的展示值。 }
        status:
          type: string
          enum: [accepted, cancelled, lost, won, refunded]
        payout_minor: { type: integer, format: int64 }
        balance_after_bet_minor:
          type: integer
          format: int64
          description: 本次投注扣款后的该币种余额快照；仅本人/有权查看该投注的接口返回。
        balance_after_refund_minor:
          type: integer
          format: int64
          description: 主动取消投注退款后的余额快照；仅取消投注响应返回。
        balance_after_settlement_minor:
          type: integer
          format: int64
          description: 赢、输、结算退款或主动取消完成瞬间的该币种余额快照；进行中的投注不返回。
        placed_at:
          type: string
          format: date-time
        settled_at: { type: string, format: date-time }
    PublicBetPlayer:
      type: object
      required: [user_id, display_name, avatar_url, is_virtual]
      properties:
        user_id: { type: integer, format: int64, minimum: 100000 }
        display_name: { type: string }
        avatar_url:
          type: string
          description: 空字符串表示未设置头像；站内 `/v1/avatars/{userID}` 地址可直接显示。
        is_virtual:
          type: boolean
          description: true 表示平台虚拟玩家。
    PublicBet:
      type: object
      required: [bet_id, player, round_id, game_type, game_name, round_sequence, currency, selection, stake_minor, payout_multiplier, payout_divisor, payout_rate, status, payout_minor, placed_at]
      properties:
        decimals: { type: integer }
        stake: { type: string, description: 投注额展示值 }
        payout: { type: string, description: 派奖额展示值 }
        bet_id: { type: string, format: uuid }
        player: { $ref: '#/components/schemas/PublicBetPlayer' }
        round_id: { type: string, format: uuid }
        game_type: { type: string }
        game_name: { type: string }
        round_sequence: { type: integer, format: int64 }
        currency: { type: string }
        game_room_id: { type: string, format: uuid }
        game_room_code: { type: string }
        game_room_name: { type: string }
        play_mode: { type: string, enum: [guess, dodge, road] }
        selection: {}
        stake_minor: { type: integer, format: int64 }
        payout_multiplier: { type: integer, format: int64 }
        payout_divisor: { type: integer, format: int64 }
        payout_rate: { type: string, example: '1.94' }
        status: { type: string, enum: [accepted, cancelled, won, lost, refunded] }
        payout_minor: { type: integer, format: int64 }
        placed_at: { type: string, format: date-time }
        settled_at: { type: string, format: date-time }
    AdminCurrentBet:
      type: object
      required: [bet_id, user_id, login_name, display_name, is_virtual, game_type, game_name, round_sequence, currency, selection, stake_minor, payout_multiplier, payout_divisor, payout_rate, status, created_at]
      properties:
        bet_id: { type: string, format: uuid }
        user_id: { type: integer, format: int64, minimum: 100000 }
        login_name: { type: string }
        display_name: { type: string }
        is_virtual: { type: boolean }
        game_type: { type: string }
        game_name: { type: string }
        round_sequence: { type: integer, format: int64 }
        currency: { type: string }
        game_room_id: { type: string, format: uuid }
        game_room_code: { type: string }
        game_room_name: { type: string }
        play_mode: { type: string, enum: [guess, dodge, road] }
        selection: {}
        stake_minor: { type: integer, format: int64 }
        payout_multiplier: { type: integer, format: int64 }
        payout_divisor: { type: integer, format: int64 }
        payout_rate: { type: string }
        status: { type: string, enum: [accepted, cancelled, won, lost, refunded] }
        created_at: { type: string, format: date-time }
    AdminBet:
      allOf:
        - $ref: '#/components/schemas/AdminCurrentBet'
        - type: object
          required: [payout_minor]
          properties:
            decimals: { type: integer }
            stake: { type: string, description: 投注额展示值，不再除以精度 }
            payout: { type: string, description: 派奖额展示值，包含返还本金 }
            status: { type: string, enum: [accepted, cancelled, won, lost, refunded] }
            payout_minor: { type: integer, format: int64 }
            settled_at: { type: string, format: date-time }
    AdminLedgerRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: integer, format: int64 }
        login_name: { type: string }
        display_name: { type: string }
        currency: { type: string }
        decimals: { type: integer }
        business_type: { type: string }
        business_id: { type: string }
        entry_type: { type: string }
        amount_minor: { type: integer, format: int64 }
        balance_after_minor: { type: integer, format: int64 }
        amount: { type: string, description: 带正负号的展示金额，正值不加加号 }
        balance_after: { type: string, description: 该笔流水后的余额展示值 }
        remark: { type: string }
        occurred_at: { type: string, format: date-time }
    RefundClearanceRecord:
      type: object
      required: [id, record_type, user_id, login_name, currency, amount_minor, balance_after_minor, status, occurred_at]
      properties:
        id: { type: string }
        record_type: { type: string, enum: [bet_refund, withdrawal, point_withdrawal, admin_debit] }
        user_id: { type: integer, format: int64, minimum: 100000 }
        login_name: { type: string }
        currency: { type: string }
        amount_minor: { type: integer, format: int64 }
        balance_after_minor: { type: integer, format: int64 }
        status: { type: string }
        bet_id: { type: string, format: uuid }
        game_type: { type: string }
        game_name: { type: string }
        round_sequence: { type: integer, format: int64 }
        game_room_id: { type: string, format: uuid }
        game_room_code: { type: string }
        game_room_name: { type: string }
        occurred_at: { type: string, format: date-time }
    WalletBalance:
      type: object
      required: [account_id, currency, available_minor, frozen_minor]
      properties:
        account_id:
          type: integer
          format: int64
          minimum: 100000
        currency:
          type: string
        available_minor:
          type: integer
          format: int64
        frozen_minor:
          type: integer
          format: int64
    WalletBalanceInfo:
      type: object
      required: [user_id, currency, available_minor, frozen_minor, decimals, available, frozen]
      properties:
        user_id: { type: integer, format: int64 }
        currency: { type: string }
        available_minor: { type: integer, format: int64 }
        frozen_minor: { type: integer, format: int64 }
        decimals: { type: integer }
        available: { type: string }
        frozen: { type: string }
    Cancellation:
      type: object
      required: [round_id, refunded_bet_count, status]
      properties:
        round_id:
          type: string
          format: uuid
        refunded_bet_count:
          type: integer
        status:
          type: string
          enum: [cancelled]
    WalletAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [user_id, currency, action, amount, request_id, first_password]
      properties:
        user_id: { type: string, pattern: '^[0-9]+$', description: 公开用户 ID 字符串 }
        currency: { type: string, minLength: 1, description: 已登记且启用的币种 }
        action: { type: string, enum: [credit, debit, reward, penalty] }
        amount: { type: string, pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$', description: 正数展示金额，不接受负数、科学计数法和超精度数值 }
        request_id: { type: string, minLength: 1, maxLength: 128 }
        remark: { type: string, description: 可选备注，UTF-8 编码不超过 2000 字节 }
        first_password: { type: string, format: password, writeOnly: true, minLength: 1 }
    WalletAdjustmentResult:
      type: object
      required: [operation_id, user_id, currency, action, amount_minor, delta_minor, balance_before_minor, balance_after_minor, frozen_minor, duplicate, occurred_at]
      properties:
        operation_id: { type: string, format: uuid }
        user_id: { type: integer, format: int64 }
        currency: { type: string }
        action: { type: string, enum: [credit, debit, reward, penalty] }
        amount_minor: { type: integer, format: int64, description: 正数业务金额 }
        delta_minor: { type: integer, format: int64, description: 可用余额变动，上分/赠分为正，下分/扣分为负 }
        balance_before_minor: { type: integer, format: int64 }
        balance_after_minor: { type: integer, format: int64 }
        frozen_minor: { type: integer, format: int64, description: 本次操作时未变动的冻结余额 }
        duplicate: { type: boolean, description: true 表示重放首次结果，未重复变更余额 }
        occurred_at: { type: string, format: date-time }
    AdminCreditRequest:
      type: object
      additionalProperties: false
      required: [user_id, currency, amount, request_id, first_password]
      properties:
        first_password:
          type: string
          format: password
          writeOnly: true
          description: 后台全局一级操作密码，必须在本次请求内提交。
        user_id:
          type: string
          pattern: '^[0-9]+$'
          description: 目标公开用户 ID 的十进制字符串，例如 "100009"；Go 请求字段为 string，不能传 JSON 数字。
        currency:
          type: string
          minLength: 1
          description: 已登记且启用的平台币种代码。
        amount:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
          description: 展示单位的正数十进制字符串；后端按币种精度换算。例如 POINTS 的 "100" 入账为 100000 minor，"1.5" 入账为 1500 minor。
        remark:
          type: string
          description: 备注，写入流水，UTF-8 编码不超过 2000 字节。
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          description: 同一管理员下的幂等键，与统一上下分接口共用；修改业务参数后重用返回 409。
    CreditResult:
      type: object
      required: [user_id, currency, amount_minor, balance_after_minor, credited, occurred_at]
      properties:
        user_id:
          type: integer
          format: int64
          minimum: 100000
        currency:
          type: string
        amount_minor:
          type: integer
          format: int64
        balance_after_minor:
          type: integer
          format: int64
        credited:
          type: boolean
          description: false 表示重复请求，未重复入账。
        occurred_at:
          type: string
          format: date-time
    ConsumeStaminaRequest:
      type: object
      additionalProperties: false
      required: [user_id, amount_minor, activity_id]
      properties:
        user_id:
          type: string
          pattern: '^[0-9]+$'
          description: 公开用户 ID 字符串，例如 "100009"；不能传 JSON 数字。
        amount_minor:
          type: integer
          format: int64
          minimum: 1
        activity_id:
          type: string
          minLength: 1
          description: 活动标识；同一用户同一活动不重复扣减。
        remark:
          type: string
    ConsumeResult:
      type: object
      required: [user_id, amount_minor, balance_after_minor, consumed, occurred_at]
      properties:
        user_id:
          type: integer
          format: int64
          minimum: 100000
        amount_minor:
          type: integer
          format: int64
        balance_after_minor:
          type: integer
          format: int64
        consumed:
          type: boolean
          description: false 表示重复请求，未重复扣减。
        occurred_at:
          type: string
          format: date-time
    BetTask:
