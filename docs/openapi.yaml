openapi: 3.1.0
info:
  title: Block Beast Platform API
  version: 0.2.0
  description: |
    Socket个人投注结算事件game.bet.settled每位玩家每个round_id一条，bets包含中奖和未中奖主单，totals按币种汇总实际金额stake/payout/net_win；具体契约见docs/realtime-api.md。
    0066起真实玩家注册和后台创建账号时原子创建上分/下分客服房间，虚拟账号不自动创建；POST /v1/chat/customer-service仍提供幂等获取或创建，注册响应结构不变。
    0067起所有账号仅保留最新成功登录会话，旧访问令牌返回401、旧刷新令牌失效；请求字段不变，无需设备ID。刷新沿用会话。迁移撤销旧会话，升级后需重新登录；Socket定期检测撤销并以1008关闭。
    金额响应去掉小数末尾多余的零，仍为字符串：2223.000000返回"2223"，1.500返回"1.5"，0.000返回"0"；有效小数不截断，币种decimals与输入精度限制不变。HTTP和Socket一致，旧示例补零金额以此规则为准。
    前端金额协议：请求提交实际币种金额（JSON数字或十进制字符串），响应仅返回实际金额的十进制字符串，不返回最小单位金额字段。币种精度由后端查询currencies表并转换。旧最小单位请求字段会被拒绝。链上机器回调仍遵循其签名协议。
    对外 error 提示统一为简体中文；HTTP 状态码及机器可读字段、枚举保持不变。未知内部错误统一返回“操作失败，请稍后重试”，不透传数据库或第三方错误详情。
    所有前端请求金额由后端转换；平台精度读取GET /v1/currencies，链上资产精度不用于前端钱包换算。

    除健康检查、平台信息和认证接口外的业务接口均需携带 `Authorization: Bearer <access_token>` 访问令牌；登录或注册返回默认有效期 15 分钟的访问令牌和可轮换的刷新令牌。投注、钱包等账号级资源仅本人或具备 operator/admin 角色的账号可访问；轮次取消仅限 operator/admin。
  license:
    name: UNLICENSED
security: []
servers:
- url: "/"
  description: Current deployment (same origin)
- url: http://localhost:8080
  description: Local development
tags:
- name: System
  description: 存活与依赖就绪检查。
- name: Platform
  description: 平台元信息。
- name: Auth
  description: 登录与访问令牌。
- name: Rounds
  description: 游戏轮次查询与操作。
- name: Bets
  description: 投注创建和查询。
- name: Wallets
  description: 钱包余额查询。
- name: Chain
  description: 链上充值回调与提现。
- name: Admin
  description: 管理后台操作（积分/USDT/体力充值）。
- name: Stamina
  description: 体力消耗与流水。
- name: Tasks
  description: 参与活动产生的投注任务。
- name: Chat
  description: 公共聊天与客服会话。
- name: Uploads
  description: S3 兼容对象存储直传与确认。
- name: Leaderboards
  description: 已结算有效投注的 UTC 每日排行榜。
- name: RedPackets
  description: 聊天室红包创建、领取和查询。
paths:
  /v1/admin/bets/{betID}/void:
    post:
      tags: [Operations]
      summary: 后台作废单笔未最终结算投注并退款
      description: admin/operator和后台二级密码；允许封盘后作废，已最终结算拒绝409。真实单退本金一次，模拟单不动钱包。按操作人/request_id幂等，重用不同参数409。
      security:
      - bearerAuth: []
      parameters:
      - {name: betID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id, reason, second_password]
              properties:
                request_id: {type: string, minLength: 1, maxLength: 128}
                reason: {type: string, minLength: 1, maxLength: 2000}
                second_password: {type: string, writeOnly: true}
      responses:
        '200':
          description: 作废结果，重复请求duplicate=true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BetVoidResult'}
        '409': {description: 已最终结算、请求编号参数冲突或余额溢出}
  /v1/admin/bet-voids:
    get:
      tags: [Operations]
      summary: 查询后台投注作废记录
      security:
      - bearerAuth: []
      parameters:
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: admin/operator；分页记录和全量总数
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  total: {type: integer, format: int64}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/BetVoidResult'}
  /v1/admin/users/{userID}/agent-relation:
    get:
      tags: [Admin]
      summary: 后台查询指定用户的直属代理关系
      security:
      - bearerAuth: []
      parameters:
      - {name: userID, in: path, required: true, schema: {type: integer, format: int64, minimum: 10001}}
      responses:
        '200':
          description: 未绑定时parent_user_id为null
          content:
            application/json:
              schema:
                type: object
                required: [user_id, parent_user_id]
                properties:
                  user_id: {type: integer, format: int64}
                  parent_user_id: {type: [integer, 'null'], format: int64}
    put:
      tags: [Operations]
      summary: 给尚无上级的真实用户绑定真实上级
      description: admin/operator及后台二级密码；禁止改挂、循环及虚拟用户关系，维护后代路径；等级设置仍使用原agent-level接口。
      security:
      - bearerAuth: []
      parameters:
      - {name: userID, in: path, required: true, schema: {type: integer, format: int64, minimum: 10001}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parent_user_id, second_password]
              properties:
                parent_user_id: {type: integer, format: int64, minimum: 10001}
                second_password: {type: string, writeOnly: true}
      responses:
        '200':
          description: 已绑定
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: {type: integer, format: int64}
                  parent_user_id: {type: integer, format: int64}
        '409': {description: 已有上级，不允许覆盖}
  /v1/admin/login-whitelist:
    get:
      tags: [Operations]
      summary: 查询用户/IP白名单及风险检测启用状态
      security:
      - bearerAuth: []
      responses:
        '200':
          description: admin/operator可查。第三方检测暂不接入，risk_check_enabled和whitelist_effective固定false。
          content:
            application/json:
              schema:
                type: object
                required: [risk_check_enabled, whitelist_effective, status, items]
                properties:
                  risk_check_enabled: {type: boolean, const: false}
                  whitelist_effective: {type: boolean, const: false}
                  status: {type: string}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/LoginWhitelistEntry'}
    post:
      tags: [Operations]
      summary: 保存用户或IP白名单（同目标重复保存更新备注）
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [second_password]
              properties:
                user_id: {type: integer, format: int64, minimum: 10001, description: 与ip二选一}
                ip: {type: string, description: 单个IPv4/IPv6地址，不接受CIDR；与user_id二选一}
                remark: {type: string, maxLength: 200}
                second_password: {type: string, writeOnly: true}
      responses:
        '200':
          description: 保存成功；配置不绕过密码、禁用账号或角色限制
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginWhitelistEntry'}
  /v1/admin/login-whitelist/{entryID}:
    delete:
      tags: [Operations]
      summary: 幂等删除白名单配置
      security:
      - bearerAuth: []
      parameters:
      - {name: entryID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [second_password]
              properties:
                second_password: {type: string, writeOnly: true}
      responses:
        '204': {description: 已删除或原本不存在；需admin/operator及后台二级密码}
  /v1/admin/rebate-records:
    get:
      tags: [Operations]
      summary: 分页查询级差返水明细及同筛选条件的分币种统计
      security:
      - bearerAuth: []
      parameters:
      - {name: source_user_id, in: query, schema: {type: integer, format: int64, minimum: 10001}}
      - {name: beneficiary_user_id, in: query, schema: {type: integer, format: int64, minimum: 10001}}
      - {name: currency, in: query, schema: {type: string}}
      - {name: status, in: query, schema: {type: string, enum: [paid, reversed]}}
      - {name: game_type, in: query, schema: {type: string}}
      - {name: game_room_id, in: query, schema: {type: string, format: uuid}}
      - {name: from, in: query, schema: {type: string, format: date-time}}
      - {name: to, in: query, schema: {type: string, format: date-time}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: 仅admin/operator；排除模拟投注及虚拟用户；仅包含新版级差返水
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RebateRecords'}
  /v1/agents/me/rebates:
    get:
      tags: [Operations]
      summary: 本人收取的级差返水明细及统计
      description: 与后台查询相同筛选、分页和响应结构；收款人强制为登录用户，不可通过筛选查询他人收入。
      security:
      - bearerAuth: []
      parameters:
      - {name: currency, in: query, schema: {type: string}}
      - {name: status, in: query, schema: {type: string, enum: [paid, reversed]}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: 本人分页明细及分币种统计
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RebateRecords'}
  /v1/admin/rebate-configs:
    get:
      tags: [Operations]
      summary: 查询哈希级差返水配置
      security:
      - bearerAuth: []
      parameters:
      - {name: game_type, in: query, schema: {type: string, enum: [hash_9, hash_13, hash_17, hash_19, hash_23, hash_29]}}
      - {name: game_room_id, in: query, schema: {type: string, format: uuid}}
      - {name: currency, in: query, schema: {type: string}}
      responses:
        '200':
          description: 配置数组；admin/operator可读
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RebateConfig'
  /v1/admin/rebate-configs/{configID}:
    put:
      tags: [Operations]
      summary: 修改单组级差返水配置（仅影响后续新投注）
      security:
      - bearerAuth: []
      parameters:
      - {name: configID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, enabled, levels, second_password]
              properties:
                version: {type: integer, format: int64, minimum: 1}
                enabled: {type: boolean}
                second_password: {type: string, writeOnly: true}
                levels:
                  type: array
                  minItems: 6
                  maxItems: 6
                  items:
                    $ref: '#/components/schemas/RebateLevel'
      responses:
        '200':
          description: 更新后配置；需admin/operator和后台二级密码
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebateConfig'
        '400': {description: 参数无效，必须完整提供六个等级且比例非递减}
        '403': {description: 无权限或后台密码无效}
        '404': {description: 配置不存在}
        '409': {description: 版本冲突，刷新后重试}
  "/v1/admin/tasks/progress":
    get:
      tags: [Tasks]
      summary: 后台任务进度，只读查询；仅admin
      security: [{bearerAuth: []}]
      parameters:
      - {name: task_id, in: query, schema: {type: string }}
      - {name: date, in: query, schema: {type: string }}
      - {name: user_id, in: query, schema: {type: integer, format: int64 }}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: 分页结果，金额均为实际金额字符串；任务date为中国时区YYYY-MM-DD，长期任务内部周期日期为1970-01-01。
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer, format: int64}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/TaskProgressRecord'}
        '400': {description: 查询参数无效}
        '401': {description: 未登录}
        '403': {description: 无权限}
  "/v1/activities/spin-records":
    get:
      tags: [Tasks]
      summary: 真实抽奖记录展示列表，不合成中奖记录；标识虚拟玩家
      security: [{bearerAuth: []}]
      parameters:
      - {name: spin_id, in: query, schema: {type: string }}
      - {name: currency, in: query, schema: {type: string }}
      - {name: user_id, in: query, schema: {type: integer, format: int64 }}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: 分页结果，金额均为实际金额字符串；任务date为中国时区YYYY-MM-DD，长期任务内部周期日期为1970-01-01。
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer, format: int64}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/SpinRecord'}
        '400': {description: 查询参数无效}
        '401': {description: 未登录}
        '403': {description: 无权限}
  "/v1/admin/spin-records":
    get:
      tags: [Tasks]
      summary: 后台抽奖明细，仅admin
      security: [{bearerAuth: []}]
      parameters:
      - {name: spin_id, in: query, schema: {type: string }}
      - {name: currency, in: query, schema: {type: string }}
      - {name: user_id, in: query, schema: {type: integer, format: int64 }}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: 分页结果，金额均为实际金额字符串；任务date为中国时区YYYY-MM-DD，长期任务内部周期日期为1970-01-01。
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer, format: int64}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/SpinRecord'}
        '400': {description: 查询参数无效}
        '401': {description: 未登录}
        '403': {description: 无权限}
  "/v1/admin/spins/{spinID}/enabled":
    put:
      tags: [Admin]
      summary: 独立启停转盘
      description: 仅admin，验证后台二级密码；不影响其他配置。删除保留历史奖励和资金记录。
      security: [{bearerAuth: []}]
      parameters:
      - name: spinID
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [second_password, enabled]
              properties:
                second_password: {type: string, format: password, writeOnly: true}
                enabled: {type: boolean}
      responses:
        '200':
          description: 操作成功，重复删除已删除配置也成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
        '400': {description: 参数或可用奖项无效}
        '401': {description: 未登录或后台密码错误}
        '403': {description: 无管理权限}
        '404': {description: 配置不存在}
  "/v1/admin/tasks/bet-configs/{taskID}/enabled":
    put:
      tags: [Admin]
      summary: 独立启停任务
      description: 仅admin，验证后台二级密码；不影响其他配置。删除保留历史奖励和资金记录。
      security: [{bearerAuth: []}]
      parameters:
      - name: taskID
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [second_password, enabled]
              properties:
                second_password: {type: string, format: password, writeOnly: true}
                enabled: {type: boolean}
      responses:
        '200':
          description: 操作成功，重复删除已删除配置也成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
        '400': {description: 参数或可用奖项无效}
        '401': {description: 未登录或后台密码错误}
        '403': {description: 无管理权限}
        '404': {description: 配置不存在}
  "/v1/admin/tasks/bet-configs/{taskID}":
    delete:
      tags: [Admin]
      summary: 软删除任务
      description: 仅admin，验证后台二级密码；不影响其他配置。删除保留历史奖励和资金记录。
      security: [{bearerAuth: []}]
      parameters:
      - name: taskID
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [second_password]
              properties:
                second_password: {type: string, format: password, writeOnly: true}
      responses:
        '200':
          description: 操作成功，重复删除已删除配置也成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
        '400': {description: 参数或可用奖项无效}
        '401': {description: 未登录或后台密码错误}
        '403': {description: 无管理权限}
        '404': {description: 配置不存在}
    put:
      tags: [Admin]
      summary: 编辑单条配置，不影响其他配置
      description: 仅 admin；必须验证后台二级密码。请求体禁止 id/code/items；金额传真实数量。新增超时应先查询确认，不要盲目自动重试。
      security:
      - bearerAuth: []
      parameters:
      - name: taskID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TaskConfigWrite"
      responses:
        '200':
          description: 保存后的单条配置
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BetTaskConfig"
        '400':
          description: 参数无效
        '401':
          description: 未登录或后台密码错误
        '403':
          description: 非管理员
        '404':
          description: 编辑目标不存在
        '429':
          description: 后台密码验证暂时锁定
  "/v1/admin/spins/{spinID}":
    delete:
      tags: [Admin]
      summary: 软删除转盘
      description: 仅admin，验证后台二级密码；不影响其他配置。删除保留历史奖励和资金记录。
      security: [{bearerAuth: []}]
      parameters:
      - name: spinID
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [second_password]
              properties:
                second_password: {type: string, format: password, writeOnly: true}
      responses:
        '200':
          description: 操作成功，重复删除已删除配置也成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
        '400': {description: 参数或可用奖项无效}
        '401': {description: 未登录或后台密码错误}
        '403': {description: 无管理权限}
        '404': {description: 配置不存在}
    put:
      tags: [Admin]
      summary: 编辑单条配置，不影响其他配置
