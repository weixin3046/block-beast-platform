              schema:
                type: object
                required: [receiver_uid, item_id, balance, queried_at]
                properties:
                  receiver_uid: {type: string}
                  item_id: {type: integer, enum: [102201]}
                  balance: {type: string, example: '5160.07704'}
                  queried_at: {type: string, format: date-time}
        '400':
