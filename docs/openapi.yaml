        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/Unavailable"
        '409':
          description: 未设置全局一级密码或幂等参数冲突。
        '429':
          description: 验证锁定，Retry-After 为 900 秒。
