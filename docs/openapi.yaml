        title:
          type: string
          minLength: 1
          maxLength: 100
          description: 去首尾空白后非空，最多100个UTF-16单位
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: 纯文本，去首尾空白后非空，最多2000个UTF-16单位
        category:
          type: string
          maxLength: 50
          default: ''
          description: 去首尾空白后最多50个UTF-16单位
        sort:
          type: integer
          format: int64
          minimum: 0
          default: 0
        enabled:
          type: boolean
          default: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PointWithdrawalRequest:
      type: object
      required:
      - request_id
      - amount
      properties:
        account_id:
          type: string
          pattern: "^[0-9]+$"
          description: 可省略，正常登录取 Token 主体；仅鉴权关闭时使用公开用户 ID 字符串
        request_id:
          type: string
          minLength: 1
        remark:
          type: string
        amount:
          type:
          - string
          - number
          description: 实际币种金额；请求可传数字或十进制字符串，响应返回十进制字符串。后端按对应币种精度转换。
    PointWithdrawal:
      type: object
      required:
      - id
      - user_id
      - client_request_id
      - amount
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: integer
          format: int64
          minimum: 10001
        client_request_id:
          type: string
        status:
          type: string
          enum:
          - requested
          - approved
          - rejected
        created_at:
          type: string
          format: date-time
        amount:
          type: string
          description: 实际币种金额；请求可传数字或十进制字符串，响应返回十进制字符串。后端按对应币种精度转换。
    CommissionGrantRequest:
      type: object
      required:
      - request_id
      - currency
      - amount
      properties:
        request_id:
          type: string
          minLength: 1
        currency:
          type: string
        remark:
          type: string
        amount:
          type:
          - string
          - number
          description: 实际币种金额；请求可传数字或十进制字符串，响应返回十进制字符串。后端按对应币种精度转换。
    LeaderboardRewardRule:
      type: object
      additionalProperties: false
      required:
      - rank_from
      - rank_to
      - reward_currency
      - reward
      - enabled
      properties:
        rank_from:
          type: integer
          minimum: 1
        rank_to:
          type: integer
          minimum: 1
          description: 不小于 rank_from，档位不得重叠且按名次递增排列
        reward_currency:
          type: string
          minLength: 1
        enabled:
          type: boolean
        reward:
          type:
          - string
          - number
          description: 实际币种金额；请求可传数字或十进制字符串，响应返回十进制字符串。后端按对应币种精度转换。
    LeaderboardRewardRuleSet:
      type: object
      additionalProperties: false
      required:
      - period_type
      - currency
      - version
      - rules
      properties:
        period_type:
          type: string
          enum:
          - daily
          - weekly
        currency:
          type: string
          minLength: 1
          description: 排行币种
        version:
          type: integer
          format: int64
          minimum: 0
          description: 查询返回的版本号，初次配置为 0，不是 expected_version
        rules:
          type: array
          items:
            "$ref": "#/components/schemas/LeaderboardRewardRule"
          description: 完整替换档位，空数组清空奖励配置
    LeaderboardRewardRuleSetUpdate:
      type: object
      additionalProperties: false
      required:
      - period_type
      - currency
      - version
      - rules
      - second_password
      properties:
        second_password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
        period_type:
          type: string
          enum:
          - daily
          - weekly
        currency:
          type: string
          minLength: 1
          description: 排行币种
        version:
          type: integer
          format: int64
