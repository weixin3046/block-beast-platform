  "/v1/admin/lulu/transfers":
    get:
      security:
      - bearerAuth: []
      summary: 查询当前噜噜账号上游转赠流水及订单关联
      description: admin/operator；需要已启用且凭据完整。只读查询，不触发充值或提现。转出彩石按平台 UID、对方 UID、金额及自动扣款账本时间（与转赠时间前后相差不超过 30 秒，包含边界）唯一匹配；link_method 标明推断依据，不代表上游交易号核实。人工确认及超出此时间窗口的提现不参与匹配。
      parameters:
      - name: direction
        in: query
        schema:
          type: string
          enum: [received, sent]
          default: received
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: 上游分页结果，item_num 的正负方向保留在 amount 中
          content:
            application/json:
              schema:
                type: object
                properties:
                  receiver_uid: {type: string}
                  page: {type: integer}
                  size: {type: integer}
                  total: {type: integer, format: int64}
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        direction: {type: string, enum: [received, sent]}
                        counterparty_uid: {type: string}
                        nickname: {type: string}
                        item_id: {type: integer, format: int64}
                        amount: {type: string}
                        occurred_at: {type: string, format: date-time}
                        linked: {type: boolean}
                        order_id: {type: string, format: uuid}
                        order_status: {type: string}
                        link_method:
                          type: string
                          enum: [receipt_id, account_uid_amount_completion_window]
                          description: receipt_id 为充值流水关联；account_uid_amount_completion_window 为提现时间金额推断，仅供展示。
                        link_reason:
                          type: string
                          enum: [no_matching_receipt, no_matching_withdrawal, ambiguous_withdrawal, ambiguous_transfer, unsupported_item, invalid_transfer_amount]
        '400':
          description: 分页或方向参数无效
        '401':
          description: 未登录
        '403':
          description: 非后台人员
        '502':
          description: 上游登录失效
        '503':
          description: 通道关闭或未配置
        '500':
          description: 上游查询或本地关联读取失败

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RoundID:
      name: roundID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BetID:
      name: betID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccountID:
      name: accountID
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 10001
        description: 公开数字用户 ID。
    Limit:
      name: limit
      in: query
      required: false
      description: 返回数量，默认 50，范围 1–100。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      description: 分页偏移，默认 0。
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    BadRequest:
      description: 请求参数或 JSON 请求体无效。
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Unauthorized:
      description: 缺少访问令牌，或令牌无效、已过期、凭证错误。
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Forbidden:
      description: 已认证但角色不足、资源属于其他账号，或账号未激活。
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    NotFound:
      description: 请求的资源不存在。
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Conflict:
      description: 当前资源状态不允许该操作，或余额不足。
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    TooManyRequests:
      description: 同一登录名在统计窗口内失败次数过多，账号已被临时锁定。
      headers:
        Retry-After:
          description: 客户端再次尝试前至少等待的秒数。
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Unavailable:
      description: 服务依赖尚未就绪或对应能力未启用。
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
  schemas:
    BetVoidResult:
      type: object
      required: [operation_id, bet_id, user_id, operator_user_id, game_type, round_sequence, currency, stake, refund, is_simulated, reason, status, duplicate, created_at]
      properties:
        operation_id: {type: string, format: uuid}
        bet_id: {type: string, format: uuid}
        user_id: {type: integer, format: int64}
        operator_user_id: {type: integer, format: int64}
        game_type: {type: string}
        round_sequence: {type: integer, format: int64}
        currency: {type: string}
        stake: {type: string, description: 原投注实际金额}
        refund: {type: string, description: 实际退款金额，模拟单为零}
        is_simulated: {type: boolean}
        reason: {type: string}
        status: {type: string, enum: [voided]}
        duplicate: {type: boolean}
        created_at: {type: string, format: date-time}
    LoginWhitelistEntry:
      type: object
      required: [id, user_id, ip, remark, updated_by, updated_at]
      properties:
        id: {type: string, format: uuid}
        user_id: {type: [integer, 'null'], format: int64}
        ip: {type: string, description: 用户白名单时为空字符串}
        remark: {type: string}
        updated_by: {type: integer, format: int64}
        updated_at: {type: string, format: date-time}
    RebateRecords:
      type: object
      required: [items, total, summary]
      properties:
        total: {type: integer, format: int64}
        items:
          type: array
          items:
            type: object
            required: [id, bet_id, source_user_id, beneficiary_user_id, round_sequence, game_type, game_room_id, game_room_name, currency, base, agent_level, differential_per_mille, amount, status, created_at]
            properties:
              id: {type: string, format: uuid}
              bet_id: {type: string, format: uuid}
              source_user_id: {type: integer, format: int64}
              beneficiary_user_id: {type: integer, format: int64}
              round_sequence: {type: integer, format: int64}
              game_type: {type: string}
              game_room_id: {type: string, format: uuid}
              game_room_name: {type: string}
              currency: {type: string}
              base: {type: string, description: 实际数量表示的返水基数}
              agent_level: {type: integer, minimum: 1, maximum: 6}
              differential_per_mille: {type: integer, minimum: 1, maximum: 1000}
              amount: {type: string, description: 实际数量表示的返水金额}
              status: {type: string, enum: [paid, reversed]}
              created_at: {type: string, format: date-time}
        summary:
          type: array
          description: 相同筛选下的全量统计，不受分页影响，各币种独立统计；来源投注去重计数。
          items:
            type: object
            required: [currency, source_bets, paid_count, reversed_count, paid_amount, reversed_amount]
            properties:
              currency: {type: string}
              source_bets: {type: integer, format: int64}
              paid_count: {type: integer, format: int64}
              reversed_count: {type: integer, format: int64}
              paid_amount: {type: string}
              reversed_amount: {type: string}
    RebateLevel:
      type: object
      required: [level, rate_per_mille]
      properties:
        level: {type: integer, minimum: 1, maximum: 6}
        rate_per_mille: {type: integer, minimum: 0, maximum: 1000, description: '千分比整数，14表示14‰即1.4%'}
    RebateConfig:
      type: object
      required: [id, game_type, game_room_id, game_room_name, currency, enabled, version, levels, updated_at]
      properties:
        id: {type: string, format: uuid}
        game_type: {type: string}
        game_room_id: {type: string, format: uuid}
        game_room_name: {type: string}
        currency: {type: string}
        enabled: {type: boolean}
        version: {type: integer, format: int64}
        updated_at: {type: string, format: date-time}
        levels:
          type: array
          items:
            $ref: '#/components/schemas/RebateLevel'
    SpinRecord:
      type: object
      properties:
        id: {type: string, format: uuid}
        spin_id: {type: string, format: uuid}
        user_id: {type: integer, format: int64}
        display_name: {type: string}
        is_virtual: {type: boolean}
        prize_id: {type: string}
        prize_label: {type: string}
        currency: {type: string, description: 奖励币种，currency查询也按奖励币种筛选}
        amount: {type: string}
        created_at: {type: string, format: date-time}
    TaskProgressRecord:
      type: object
      properties:
        task_id: {type: string, format: uuid}
        user_id: {type: integer, format: int64}
        display_name: {type: string}
        title: {type: string}
        period_type: {type: string, enum: [daily, global]}
        period_date: {type: string, format: date}
        accumulation_currency: {type: string}
        progress: {type: string}
        threshold: {type: string}
        complete_count: {type: integer}
        max_complete_count: {type: integer}
        updated_at: {type: string, format: date-time}
    TaskRewardWrite:
      type: object
      additionalProperties: false
      required: [currency, amount]
      properties:
        currency:
          type: string
        amount:
          type: [number, string]
          description: 正的实际币种金额。
    TaskReward:
      type: object
      properties:
        currency:
          type: string
        amount:
          type: string
        balance_after:
          type: string
          description: 领取响应中的该奖励币种事后余额；配置和进度查询不返回此字段。
    RobotPlanInput:
      type: object
      description: 不传id/code；金额为实际金额，后端换算精度。只支持虚拟用户。
      required: [user_id, enabled, game_type, game_room_id, currency, min_stake, max_stake, selections, skip_min, skip_max]
      properties:
        user_id: {type: integer, format: int64}
        enabled: {type: boolean}
        game_type: {type: string, enum: [hash_9, hash_13, hash_17, hash_19, hash_23, hash_29]}
        game_room_id: {type: string, format: uuid}
        currency: {type: string}
        min_stake: {type: [number, string], description: 正的实际金额，不能超过max_stake}
        max_stake: {type: [number, string], description: 实际单注上限，所有候选玩法都必须符合房间限额}
        skip_min: {type: integer, minimum: 1, maximum: 10000}
        skip_max: {type: integer, minimum: 1, maximum: 10000, description: 不小于skip_min，单位为期而非秒}
        selections:
          type: array
          minItems: 1
          maxItems: 24
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [play_mode, pick]
            properties:
              play_mode: {type: string, enum: [road, guess, dodge]}
              pick: {type: string, description: road为odd/even/big/small；guess和dodge为0到9的字符串}
    RobotPlan:
      allOf:
      - {$ref: '#/components/schemas/RobotPlanInput'}
      - type: object
        properties:
          id: {type: string, format: uuid, readOnly: true}
          min_stake: {type: string}
          max_stake: {type: string}
          login_name: {type: string}
          display_name: {type: string}
          is_virtual: {type: boolean}
          user_status: {type: string}
          next_round_sequence: {type: [integer, 'null'], format: int64}
          last_seen_sequence: {type: [integer, 'null'], format: int64}
          last_checked_at: {type: [string, 'null'], format: date-time}
          last_status: {type: string}
          last_error: {type: string}
          last_bet_id: {type: [string, 'null'], format: uuid}
          created_at: {type: string, format: date-time}
          updated_at: {type: string, format: date-time}
    TaskConfigWrite:
      type: object
      additionalProperties: false
      required: [second_password, accumulation_currency, threshold, enabled]
      oneOf:
      - required: [rewards]
        not:
          anyOf:
          - required: [reward]
          - required: [reward_currency]
      - required: [reward_currency, reward]
        not:
          required: [rewards]
      properties:
        rewards:
          type: array
          minItems: 1
          maxItems: 32
          description: 每项币种唯一，金额独立按币种精度换算。旧reward/reward_currency仅为首项摘要，新页面以rewards为准。
          items:
            $ref: '#/components/schemas/TaskRewardWrite'
        title:
          type: string
        period_type:
          type: string
          enum: [daily, global]
          default: daily
        sort_order:
          type: integer
          default: 0
        max_complete_count:
          type: integer
          minimum: 0
          maximum: 100000
          default: 1
          description: 0表示不限制完成次数，daily按日计次，global累计计次。
        second_password:
          type: string
          format: password
          writeOnly: true
        accumulation_currency:
          type: string
        threshold:
          type: [number, string]
        reward_currency:
          type: string
        reward:
          type: [number, string]
        enabled:
          type: boolean
    SpinConfigWrite:
      type: object
      additionalProperties: false
      required: [second_password, title, enabled, cost_currency, cost, sort_order, prizes]
      properties:
        second_password:
          type: string
          format: password
          writeOnly: true
        title:
          type: string
        enabled:
          type: boolean
        cost_currency:
          type: string
        cost:
          type: [number, string]
        sort_order:
          type: integer
        prizes:
          type: array
          minItems: 1
          description: 当前转盘的完整奖项列表；新增奖项不传 id；编辑已有奖项回传 UUID，漏传的奖项会移除。
          items:
            type: object
            additionalProperties: false
            required: [label, currency, amount, weight]
            properties:
              id:
                type: string
                format: uuid
                description: 仅编辑已有奖项时传，必须属于当前转盘；新增转盘的奖项不得传。
              label:
                type: string
              currency:
                type: string
              amount:
                type: [number, string]
              disabled:
                type: boolean
                default: false
              weight:
                type: integer
                minimum: 0
                description: 非负整数，允许0；零权重奖项不中奖但可展示。禁用奖项不计入总权重，启用转盘的有效总权重必须大于0。
    CurrencyStatistic:
      type: object
      required:
      - currency
      - decimals
      - bet_count
      - bet_loss
      properties:
        currency:
          type: string
        decimals:
          type: integer
        bet_count:
          type: integer
          format: int64
        stake:
          type: string
          description: 实际币种金额；请求可传数字或十进制字符串，响应返回十进制字符串。后端按对应币种精度转换。
        payout:
          type: string
          description: 实际币种金额；请求可传数字或十进制字符串，响应返回十进制字符串。后端按对应币种精度转换。
        bet_loss:
          type: string
          description: 投注总输款；按订单创建时间筛选，汇总当前lost且非模拟订单本金，排除虚拟用户。合单只计一次，非负实际金额，不是净亏损或人工扣分。
        deposit:
          type: string
          description: 实际币种金额；请求可传数字或十进制字符串，响应返回十进制字符串。后端按对应币种精度转换。
        credit:
          type: string
          description: 实际币种金额；请求可传数字或十进制字符串，响应返回十进制字符串。后端按对应币种精度转换。
        clearance:
          type: string
          description: 实际币种金额；请求可传数字或十进制字符串，响应返回十进制字符串。后端按对应币种精度转换。
        gift:
          type: string
          description: 实际币种金额；请求可传数字或十进制字符串，响应返回十进制字符串。后端按对应币种精度转换。
        penalty:
          type: string
          description: 实际币种金额；请求可传数字或十进制字符串，响应返回十进制字符串。后端按对应币种精度转换。
        balance:
          type: string
          description: 实际币种金额；请求可传数字或十进制字符串，响应返回十进制字符串。后端按对应币种精度转换。
    AdminUserBalance:
      type: object
      properties:
        currency:
          type: string
        decimals:
          type: integer
        available:
          type: string
          description: 实际币种金额；请求可传数字或十进制字符串，响应返回十进制字符串。后端按对应币种精度转换。
        frozen:
          type: string
          description: 实际币种金额；请求可传数字或十进制字符串，响应返回十进制字符串。后端按对应币种精度转换。
    AdminDashboard:
      type: object
      required:
      - server_time
      - players
      - global
      properties:
        server_time:
          type: string
          format: date-time
        global:
          type: array
          items:
            "$ref": "#/components/schemas/CurrencyStatistic"
        players:
          type: array
          items:
            type: object
            required:
            - user_id
            - login_name
            - display_name
            - bet_count
            - funds
            properties:
              user_id:
                type: integer
                format: int64
              login_name:
                type: string
              display_name:
                type: string
              bet_count:
                type: integer
                format: int64
              funds:
                type: array
                items:
                  "$ref": "#/components/schemas/CurrencyStatistic"
    CustomerPhraseInput:
      type: object
      additionalProperties: false
      required:
      - title
      - content
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: 去首尾空白后非空，最多100个UTF-16单位
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: 纯文本，去首尾空白后非空，最多2000个UTF-16单位
        category:
