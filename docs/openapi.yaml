  "/v1/users/me/password":
    put:
      tags:
      - Auth
      summary: 修改当前用户密码
      description: 必须提交当前密码；成功后会撤销所有刷新令牌，需重新登录。
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - current_password
              - new_password
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 1
      responses:
        '204':
          description: 修改成功
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/v1/users/me/secondary-password":
    put:
      tags:
      - Auth
      summary: 设置或修改当前用户二级密码
      description: 先通过 GET /v1/users/me 的 secondary_password_set 判断流程。首次设置无需额外验证；已设置后修改必须验证旧二级密码。服务端以数据库中的实际设置状态为准，尚未设置时即使误带
        current_secondary_password 也按首次设置处理。二级密码只保存 Argon2id 不可逆哈希，不会撤销当前登录会话。
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - secondary_password
              properties:
                current_secondary_password:
                  type: string
                  format: password
                  description: 修改时必填，用于验证旧二级密码。
                secondary_password:
                  type: string
                  format: password
                  minLength: 1
      responses:
        '204':
          description: 设置成功
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '409':
          description: 已设置二级密码但未提供旧二级密码。
  "/v1/users/me/secondary-password/verify":
    post:
      tags:
      - Auth
      summary: 验证当前用户二级密码
      description: 仅返回本次校验结果，不签发后续敏感操作可消费的验证凭证，也不会自动保护提现等业务接口。
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - secondary_password
              properties:
                secondary_password:
                  type: string
                  format: password
      responses:
        '204':
          description: 验证通过
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '409':
          description: 尚未设置二级密码
