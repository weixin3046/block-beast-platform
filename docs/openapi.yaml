        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RoundID:
      name: roundID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BetID:
      name: betID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccountID:
      name: accountID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      description: 返回数量，默认 50，范围 1–100。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      description: 分页偏移，默认 0。
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    BadRequest:
      description: 请求参数或 JSON 请求体无效。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 缺少访问令牌，或令牌无效、已过期、凭证错误。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 已认证但角色不足、资源属于其他账号，或账号未激活。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 请求的资源不存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 当前资源状态不允许该操作，或余额不足。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 同一登录名在统计窗口内失败次数过多，账号已被临时锁定。
      headers:
        Retry-After:
          description: 客户端再次尝试前至少等待的秒数。
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: 服务依赖尚未就绪或对应能力未启用。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    AdminUser:
      type: object
      required: [id, login_name, display_name, status, created_at]
      properties:
        id:
          type: integer
          format: int64
          minimum: 100000
          description: 面向前端和后台的数字用户 ID；UUID 仅用于内部关联。
        login_name: { type: string }
        display_name: { type: string }
        status: { type: string, enum: [active, disabled, bet_banned] }
        created_at: { type: string, format: date-time }
    PlatformConfig:
      type: object
      required: [key, value, visibility, version, updated_at]
      properties:
        key: { type: string }
        value: {}
        visibility: { type: string, enum: [public, internal] }
        version: { type: integer, format: int64, minimum: 1 }
        updated_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
    Role:
      type: object
      required: [code, description]
      properties:
        code: { type: string, enum: [player, operator, admin] }
        description: { type: string }
    RoleAssignment:
      type: object
      required: [user_id, roles]
      properties:
        user_id: { type: string, format: uuid }
        roles:
          type: array
          items: { type: string, enum: [player, operator, admin] }
    RedPacket:
      type: object
      required: [id, room_id, sender_user_id, client_request_id, currency, greeting, total_minor, remaining_minor, packet_count, claimed_count, status, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        room_id: { type: string, format: uuid }
        sender_user_id: { type: string, format: uuid }
        client_request_id: { type: string }
        currency: { type: string, enum: [USDT, POINTS] }
        greeting: { type: string }
        total_minor: { type: integer, format: int64 }
        remaining_minor: { type: integer, format: int64 }
        packet_count: { type: integer }
        claimed_count: { type: integer }
        status: { type: string, enum: [active, exhausted, refunded] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    RedPacketClaim:
      type: object
      required: [id, red_packet_id, user_id, currency, amount_minor, claimed_at]
      properties:
        id: { type: string, format: uuid }
        red_packet_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        currency: { type: string, enum: [USDT, POINTS] }
        amount_minor: { type: integer, format: int64, minimum: 1 }
        claimed_at: { type: string, format: date-time }
    LeaderboardEntry:
      type: object
      required: [rank, user_id, display_name, currency, effective_stake_minor, payout_minor, net_profit_minor, bet_count, win_count]
      properties:
        rank: { type: integer, format: int64, minimum: 1 }
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        currency: { type: string, enum: [USDT, POINTS] }
        effective_stake_minor: { type: integer, format: int64 }
        payout_minor: { type: integer, format: int64 }
        net_profit_minor: { type: integer, format: int64 }
        bet_count: { type: integer, format: int64 }
        win_count: { type: integer, format: int64 }
    Upload:
      type: object
      required: [id, owner_user_id, storage_key, content_type, size_bytes, status, created_at]
      properties:
        id: { type: string, format: uuid }
        owner_user_id: { type: string, format: uuid }
        storage_key: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        status: { type: string, enum: [pending, confirmed, expired] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    UploadAuthorization:
      type: object
      required: [upload, method, url, headers, expires_at]
      properties:
        upload: { $ref: '#/components/schemas/Upload' }
        method: { type: string, const: PUT }
        url: { type: string, format: uri-reference }
        headers:
          type: object
          additionalProperties: { type: string }
        expires_at: { type: string, format: date-time }
        requires_auth:
          type: boolean
          description: 为 true 时上传 URL 是站内接口，必须附带当前 Bearer Token。
    ChatRoom:
      type: object
      required: [id, type, created_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [global, game, customer_service, direct] }
        created_at: { type: string, format: date-time }
    ChatMessage:
      type: object
      required: [id, room_id, body, status, created_at]
      properties:
        id: { type: string, format: uuid }
        room_id: { type: string, format: uuid }
        sender_user_id: { type: string, format: uuid }
        body: { type: string }
        status: { type: string, enum: [visible, hidden, deleted] }
        client_request_id: { type: string }
        created_at: { type: string, format: date-time }
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    DepositWebhookRequest:
      type: object
      required: [event, id, chainTokenId, address, amount, txHash, txStatus]
      properties:
        event: { type: string, enum: [recharge] }
        id: { type: integer, format: int64, description: PQPA 充值事件 ID }
        applicationId: { type: integer, format: int64 }
        chainId: { type: integer, format: int64 }
        chainTokenId: { type: integer, format: int64 }
        address:
          type: string
          description: 平台分配给用户的充值地址。
        amount: { type: string, example: '100.00' }
        txHash: { type: string }
        blockHeight: { type: integer, format: int64 }
        txStatus: { type: string, example: SETTLED }
    DepositResult:
      type: object
      required: [deposit_id, status, credited]
      properties:
        deposit_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [credited]
        credited:
          type: boolean
          description: false 表示重复回调，未重复入账。
    WithdrawalRequest:
      type: object
      additionalProperties: false
      required: [client_request_id, destination_address, chain_code, currency, amount_minor]
      properties:
        client_request_id:
          type: string
          minLength: 1
          description: 客户端生成的幂等键；同一用户下必须唯一。
        destination_address:
          type: string
          minLength: 8
          maxLength: 256
          description: TRON 与 EVM 网络执行链格式校验；其他网络执行长度及空白/控制字符校验。
        destination_memo:
          type: string
          maxLength: 256
          description: 目标链要求 Memo/Tag 时填写。
        chain_code:
          type: string
          example: POLYGON
        currency:
          type: string
          example: USDT
        amount_minor:
          type: integer
          format: int64
          minimum: 1
    Withdrawal:
      type: object
      required: [withdrawal_id, client_request_id, destination_address, chain_code, currency, amount_minor, status, created_at]
      properties:
        withdrawal_id:
          type: string
          format: uuid
        client_request_id:
          type: string
        destination_address:
          type: string
        destination_memo:
          type: string
        chain_code:
          type: string
        currency:
          type: string
        amount_minor:
          type: integer
          format: int64
        status:
          type: string
          enum: [requested, approved, broadcasted, confirmed, failed, cancelled]
        created_at:
          type: string
          format: date-time
        provider_order_id:
          type: string
        tx_hash:
          type: string
        failure_reason:
          type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [login_name, password, invitation_code]
      properties:
        login_name:
          type: string
          pattern: '^[A-Za-z0-9_-]{3,32}$'
          description: 3–32 位字母、数字、连字符或下划线。
        display_name:
          type: string
          description: 展示名，缺省与登录名相同。
        password:
          type: string
          format: password
          description: 密码。
        invitation_code:
          type: string
          pattern: '^[0-9]+$'
          description: 必填。邀请人的数字邀请码，从 101 起分配。
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login_name, password]
      properties:
        login_name:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          format: password
    LoginResult:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user_id, roles]
      properties:
        access_token:
          type: string
          description: HS256 签发的 JWT 访问令牌。
        refresh_token:
          type: string
          description: 仅返回给客户端的随机令牌；服务端只保存 SHA-256 摘要。
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          format: int64
          description: 令牌有效期（秒）。
          example: 900
        user_id:
          type: integer
          format: int64
          minimum: 100000
        roles:
          type: array
          items:
            type: string
            enum: [player, operator, admin]
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
    AnnouncementInput:
      type: object
      additionalProperties: false
      required: [title, body, enabled]
      properties:
        title:
          type: string
        body:
          type: string
        enabled:
          type: boolean
        starts_at:
          type: [string, 'null']
          format: date-time
        ends_at:
          type: [string, 'null']
          format: date-time
    Announcement:
      allOf:
        - $ref: '#/components/schemas/AnnouncementInput'
        - type: object
          required: [id, created_at]
          properties:
            id:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time
    GameTypeInput:
      type: object
      additionalProperties: false
      required: [name, enabled, rules]
      properties:
        room_id:
          type: string
          format: uuid
        name:
          type: string
        mode:
          type: string
          enum: [guess, bigsmall, dodge]
        block_interval:
          type: integer
          minimum: 1
        close_before_seconds:
          type: integer
          minimum: 1
          maximum: 59
          default: 3
          description: 当前玩法在开奖前多少秒封盘，哈希和 K 线玩法均可独立配置。
        enabled:
          type: boolean
        rules:
          type: object
          required: [outcomes, payout_multiplier]
          properties:
            outcomes:
              type: array
              minItems: 1
              items:
                type: string
            payout_multiplier:
              type: integer
              minimum: 1
            payout_divisor:
              type: integer
              minimum: 1
              description: 房间玩法固定为 100，因此 194 表示 1.94 倍。
            water_rate:
              type: integer
              minimum: 0
            water_divisor:
              type: integer
              minimum: 1
            bet_limits:
              type: object
              additionalProperties:
                type: object
                required: [min_stake_minor, max_stake_minor]
                properties:
                  min_stake_minor:
                    type: integer
                    minimum: 0
                  max_stake_minor:
                    type: integer
                    minimum: 1
            match_field:
              type: string
            result_count:
              type: integer
              minimum: 1
            source:
              type: string
              enum: [tron_hash, okx_kline]
            extras:
              type: object
            dodge_mode:
              type: boolean
    GameRoomInput:
      type: object
      additionalProperties: false
      required: [name, game_kind, enabled, sort_order]
      properties:
        name:
          type: string
        game_kind:
          type: string
          enum: [hash, kline]
          description: 房间游戏分类；进入 K 线房间后再选择 BTC 或 ETH。
        enabled:
          type: boolean
        sort_order:
          type: integer
    GameRoom:
      allOf:
        - $ref: '#/components/schemas/GameRoomInput'
        - type: object
          required: [id, game_types, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
              description: 后端自动生成的内部标识，前端不得要求运营人员填写。
            game_types:
              type: array
              items:
                type: object
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: round not found
    Platform:
      type: object
      required: [environment, domains]
      properties:
        environment:
          type: string
          example: development
        domains:
          type: array
          items:
            type: string
    Round:
      type: object
      required: [round_id, game_type, sequence, status, bet_closes_at, result_at]
      properties:
        round_id:
          type: string
          format: uuid
        game_type:
          type: string
          example: dice
        sequence:
          type: integer
          format: int64
        status:
          type: string
          enum: [open, closed, settling, settled, cancelled]
        bet_closes_at:
          type: string
          format: date-time
        result_at:
          type: string
          format: date-time
          description: 固定比 bet_closes_at 晚 3 秒，即目标 TRON 区块前一个区块封盘。
        settled_at:
          type: string
          format: date-time
        outcome:
          type: array
          items:
            type: string
    PlaceBetRequest:
      type: object
      additionalProperties: false
      required: [client_request_id, round_id, account_id, currency, selection, stake_minor]
      properties:
        client_request_id:
          type: string
          minLength: 1
          description: 客户端生成的幂等键；同一用户下必须唯一。
        round_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        currency:
          type: string
          minLength: 1
          example: USDT
        selection:
          description: 玩法定义的有效 JSON 选择值。
        stake_minor:
          type: integer
          format: int64
          minimum: 1
    Bet:
      type: object
      required: [bet_id, client_request_id, round_id, account_id, currency, selection, stake_minor, status, placed_at]
      properties:
        bet_id:
          type: string
          format: uuid
        client_request_id:
          type: string
        round_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        currency:
          type: string
        selection: {}
        stake_minor:
          type: integer
          format: int64
        status:
          type: string
          enum: [accepted, cancelled, lost, won, refunded]
        placed_at:
          type: string
          format: date-time
    WalletBalance:
      type: object
      required: [account_id, currency, available_minor, frozen_minor]
      properties:
        account_id:
          type: string
          format: uuid
        currency:
          type: string
        available_minor:
          type: integer
          format: int64
        frozen_minor:
          type: integer
          format: int64
    Cancellation:
      type: object
      required: [round_id, refunded_bet_count, status]
      properties:
        round_id:
          type: string
          format: uuid
        refunded_bet_count:
          type: integer
        status:
          type: string
          enum: [cancelled]
    AdminCreditRequest:
      type: object
      additionalProperties: false
      required: [user_id, currency, amount_minor, request_id]
      properties:
        user_id:
          type: string
          format: uuid
          description: 目标用户 ID。
        currency:
          type: string
          enum: [POINTS, USDT, STAMINA]
          description: 充值币种。
        amount_minor:
          type: integer
          format: int64
          minimum: 1
        remark:
          type: string
          description: 备注，写入流水。
        request_id:
          type: string
          minLength: 1
          description: 幂等键；同一 request_id 不重复入账。
    CreditResult:
      type: object
      required: [user_id, currency, amount_minor, balance_after_minor, credited, occurred_at]
      properties:
        user_id:
          type: string
          format: uuid
        currency:
          type: string
        amount_minor:
          type: integer
          format: int64
        balance_after_minor:
          type: integer
          format: int64
        credited:
          type: boolean
          description: false 表示重复请求，未重复入账。
        occurred_at:
          type: string
          format: date-time
    ConsumeStaminaRequest:
      type: object
      additionalProperties: false
      required: [user_id, amount_minor, activity_id]
      properties:
        user_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
          format: int64
          minimum: 1
        activity_id:
          type: string
          minLength: 1
          description: 活动标识；同一用户同一活动不重复扣减。
        remark:
          type: string
    ConsumeResult:
      type: object
      required: [user_id, amount_minor, balance_after_minor, consumed, occurred_at]
      properties:
        user_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
          format: int64
        balance_after_minor:
          type: integer
          format: int64
        consumed:
          type: boolean
          description: false 表示重复请求，未重复扣减。
        occurred_at:
          type: string
          format: date-time
    CheckinResult:
      type: object
      required: [user_id, checkin_date, reward_minor, balance_after_minor, checked_in, occurred_at]
      properties:
        user_id:
          type: string
          format: uuid
        checkin_date:
          type: string
          format: date
        reward_minor:
          type: integer
          format: int64
          description: 本次签到发放的体力值。
        balance_after_minor:
          type: integer
          format: int64
        checked_in:
          type: boolean
          description: false 表示今日已签到。
        occurred_at:
          type: string
          format: date-time
    BetTask:
      type: object
      required: [id, threshold_minor, reward_minor, progress_minor, completed, rewarded]
      properties:
        id: { type: string, format: uuid }
        threshold_minor: { type: integer, format: int64 }
        reward_minor: { type: integer, format: int64 }
        progress_minor: { type: integer, format: int64 }
        completed: { type: boolean }
        rewarded: { type: boolean }
    BetTaskConfig:
      type: object
      required: [id, threshold_minor, reward_minor, enabled]
      properties:
        id: { type: string }
        threshold_minor: { type: integer, format: int64, minimum: 1 }
        reward_minor: { type: integer, format: int64, minimum: 1 }
        enabled: { type: boolean }
    SpinResult:
      type: object
      required: [id, prize_id, prize_label, reward_currency, reward_minor, stamina_cost, stamina_balance, reward_balance, created_at]
      properties:
        id: { type: string, format: uuid }
        prize_id: { type: string }
        prize_label: { type: string }
        reward_currency: { type: string, enum: [POINTS, USDT, STAMINA] }
        reward_minor: { type: integer, format: int64 }
        stamina_cost: { type: integer, format: int64 }
        stamina_balance: { type: integer, format: int64 }
        reward_balance: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    LedgerEntry:
      type: object
      required: [id, user_id, business_type, business_id, amount_minor, balance_after_minor, remark, occurred_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        business_type:
          type: string
          description: 业务类型，如 admin_credit / checkin_reward / bet_task_reward / activity_consume。
        business_id:
          type: string
        amount_minor:
          type: integer
          format: int64
          description: 正数为入账，负数为出账。
        balance_after_minor:
          type: integer
          format: int64
        remark:
          type: string
        operator_id:
          type: string
          description: 操作人 ID（管理员操作时存在）。
        occurred_at:
          type: string
          format: date-time
