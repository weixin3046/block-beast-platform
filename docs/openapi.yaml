                password: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
                display_name: {type: string, description: 省略或空值时后端使用用户加公开ID}
                avatar_url: {type: string, description: 可选，当前操作人已确认上传的图片storage_key}
                second_password: {type: string, writeOnly: true}
      responses:
        '201':
          description: 创建成功，不发放玩家登录令牌；仅admin/operator可用
          content:
            application/json:
              schema:
                type: object
                required: [user_id, login_name, display_name, avatar_url, status, is_virtual, roles, created_at]
                properties:
                  user_id: {type: integer, format: int64}
                  login_name: {type: string}
                  display_name: {type: string}
                  avatar_url: {type: string}
                  status: {type: string}
                  is_virtual: {type: boolean, const: false}
                  roles: {type: array, items: {type: string, enum: [player]}}
                  created_at: {type: string, format: date-time}
