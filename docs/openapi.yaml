      description: 支持 from/to 按 occurred_at 筛选，开始包含、结束不包含；RFC3339带时区。business_type和entry_type按已有响应类型值精确筛选，可与币种和游标组合；无匹配类型返回空列表。翻页保持所有筛选条件不变。
