  "/v1/admin/dashboard":
    get:
      tags:
      - Operations
      summary: 玩家统计与排除虚拟账户的全局环境统计
      description: 'global和players[].funds均按币种统计并返回decimals及展示金额字符串。删除players顶层错误的跨币种金额汇总字段；余额为当前可用加冻结，不是期末余额。统计排除虚拟账户。user只筛选players，不筛选global。from包含、to不包含；默认最近24小时。投注按下单时间，资金流水按发生时间统计。

'
      security:
      - bearerAuth: []
      parameters:
      - name: user
        in: query
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: limit
