  "/v1/admin/virtual-accounts":
    post:
      tags:
      - Operations
      summary: 创建可登录但不能下分的虚拟账户
      description: admin/operator 可创建。count 为 1–100 时以 login_name 为前缀生成可排序的编号账号（如 sadewf1 到 sadewf99），密码相同，空昵称各自生成随机 2–5 字昵称。头像只能使用当前操作人已确认的图片上传 storage_key；不接受外链。创建不启动挂机，无需初始余额，随后通过 robot-plans 创建计划。
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - login_name
              - password
              properties:
                login_name:
                  type: string
                count:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: 省略时创建单个账号；填写时创建编号批次
                display_name:
                  type: string
                  description: 可选，省略或空白时自动生成昵称；去除首尾空白后最多100字节
                avatar_url:
                  type: string
                  description: 可选，空字符串或当前管理员已确认的 JPEG/PNG/WebP 上传 storage_key，最多2048字节
                password:
                  type: string
                  description: 不能为空或全空白；不设密码长度上下限，受请求体大小限制
                initial_balances:
                  type: object
                  description: 币种代码到实际初始金额的映射，后端换算精度
                  additionalProperties:
                    type:
                    - number
                    - string
      responses:
        '201':
          description: 单个创建返回账户对象；批量创建返回 items 数组，不包含密码
          content:
            application/json:
              schema:
                type: object
                required: [user_id, login_name, display_name, avatar_url, status, is_virtual]
                properties:
                  user_id:
                    type: integer
                    format: int64
                  login_name:
                    type: string
                  display_name:
                    type: string
                  avatar_url:
                    type: string
                    description: 可直接展示的头像地址，无头像时为空字符串
                  status:
                    type: string
                  is_virtual:
                    type: boolean
                    const: true
  "/v1/admin/virtual-accounts/{userID}/automation":
    put:
      tags:
      - Operations
      summary: 旧挂机接口（已停用）
      deprecated: true
      description: 请使用 /v1/admin/robot-plans，旧配置不会自动转换。
      security:
      - bearerAuth: []
      parameters:
      - name: userID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              - currency
              - stake
              - game_type_codes
              - interval_seconds
              properties:
                enabled:
                  type: boolean
                currency:
                  type: string
                game_type_codes:
                  type: array
                  items:
                    type: string
                interval_seconds:
                  type: integer
                  minimum: 3
                  maximum: 86400
                stake:
                  type:
                  - string
                  - number
                  description: 实际币种金额；请求可传数字或十进制字符串，响应返回十进制字符串。后端按对应币种精度转换。
      responses:
        '410':
          description: 旧挂机接口已停用，请使用机器人计划接口
  "/v1/admin/robot-plans":
    get:
      tags: [Operations]
      summary: 查询机器人计划及运行状态（admin/operator）
      security: [{bearerAuth: []}]
      parameters:
      - {name: q, in: query, schema: {type: string}, description: 公开用户ID或账号名、昵称}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: 同一快照下的列表和总数
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/RobotPlan'}}
                  total: {type: integer, format: int64}
    post:
      tags: [Operations]
      summary: 创建机器人计划（admin/operator）
      description: ID由服务端生成；同一操作人和request_id幂等，相同键不同内容返回409。
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - {$ref: '#/components/schemas/RobotPlanInput'}
              - type: object
                required: [request_id]
                properties:
                  request_id: {type: string, minLength: 1, maxLength: 128}
      responses:
        '201':
          description: 创建或重放的计划
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RobotPlan'}
        '400': {description: 参数或房间限额不符合要求}
        '403': {description: 无权限}
        '409': {description: 创建幂等键冲突}
  "/v1/admin/robot-plans/{planID}":
    parameters:
    - {name: planID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Operations]
      summary: 查询单条机器人计划
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: 计划及最后执行状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RobotPlan'}
        '404': {description: 计划不存在或已删除}
    put:
      tags: [Operations]
      summary: 完整更新机器人计划并重新排期
      description: 不允许更换所属用户；请求不传id、code或request_id。
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RobotPlanInput'}
      responses:
        '200':
          description: 更新后的计划
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RobotPlan'}
        '400': {description: 参数无效}
        '404': {description: 计划不存在}
    delete:
      tags: [Operations]
      summary: 停止并软删除机器人计划
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: 幂等删除
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: {type: boolean}
  "/v1/admin/robot-plans/{planID}/enabled":
    parameters:
    - {name: planID, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [Operations]
      summary: 启停机器人计划（admin/operator）
      description: 从停止切换为开启时重新计算未来期号，重复开启不重置排期。
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        '200':
          description: 更新后的计划
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RobotPlan'}
        '404': {description: 计划不存在}
