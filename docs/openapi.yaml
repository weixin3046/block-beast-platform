      - bearerAuth: []
      parameters:
      - {name: from, in: query, schema: {type: string, format: date-time}}
      - {name: to, in: query, schema: {type: string, format: date-time}}
      - {name: business_type, in: query, schema: {type: string}}
      - {name: entry_type, in: query, schema: {type: string}}
      - name: currency
        in: query
        schema:
          type: string
        description: 可选币种代码，不传查询所有币种
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
        description: 原样传递上一页 next_cursor，翻页时保持筛选条件不变
      responses:
        '200':
          description: 按 occurred_at、id 倒序；无 next_cursor 表示结束。历史冻结快照无法还原时为 null。
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
