name: block-beast-production

x-application: &application
  image: block-beast-platform:${APP_IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      GOPROXY: ${BUILD_GOPROXY:-https://proxy.golang.org,direct}
  env_file:
    - ${APP_ENV_FILE:-.env.production}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  networks:
    - backend
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command:
      - --jetstream
      - --store_dir=/data
      - --http_port=8222
      - --user=${NATS_USER:?NATS_USER is required}
      - --pass=${NATS_PASSWORD:?NATS_PASSWORD is required}
    volumes:
      - nats-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  migrate:
    image: postgres:17-bookworm
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/app/scripts/migrate.sh"]
    volumes:
      - ./migrations:/app/migrations:ro
      - ./scripts/migrate.sh:/app/scripts/migrate.sh:ro
    working_dir: /app
    restart: "no"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  uploads-init:
    image: alpine:3.22
    command: ["sh", "-c", "mkdir -p /data/uploads && chown 65532:65532 /data/uploads && chmod 0700 /data/uploads"]
    volumes:
      - uploads-data:/data/uploads
    restart: "no"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  api:
    <<: *application
    command: ["/app/api"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      uploads-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads-data:/data/uploads
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *application
    command: ["/app/worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy

  realtime:
    <<: *application
    command: ["/app/realtime"]
    depends_on:
      nats:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  nats-data:
  uploads-data:
