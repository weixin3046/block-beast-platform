map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=block_beast_api:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=block_beast_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=block_beast_ws:10m;

upstream block_beast_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream block_beast_realtime {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name 58.87.64.208;

    server_tokens off;
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        proxy_pass http://block_beast_api;
    }

    location = /readyz {
        proxy_pass http://block_beast_api;
    }

    location = /realtime/healthz {
        proxy_pass http://block_beast_realtime/healthz;
    }

    location = /v1/ws {
        limit_conn block_beast_ws 5;
        proxy_pass http://block_beast_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }

    location = /v1/auth/login {
        limit_req zone=block_beast_auth burst=5 nodelay;
        proxy_pass http://block_beast_api;
    }

    location = /v1/admin/auth/login {
        limit_req zone=block_beast_auth burst=5 nodelay;
        proxy_pass http://block_beast_api;
    }

    location ^~ /v1/ {
        limit_req zone=block_beast_api burst=200 nodelay;
        proxy_pass http://block_beast_api;
    }

    location = /docs {
        return 301 /docs/;
    }

    location = /docs/openapi.yaml {
        alias /opt/block-beast/docs/openapi.yaml;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /docs/ {
        alias /opt/block-beast/docs/;
        autoindex on;
    }

    location = /api-docs {
        return 301 /api-docs/;
    }

    location ^~ /api-docs/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
