map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=block_beast_api:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=block_beast_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=block_beast_ws:10m;

upstream block_beast_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream block_beast_realtime {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name 58.87.64.208;

    server_tokens off;
    client_max_body_size 12m;
	root /www/wwwroot/h5;
	index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

	# API 仅监听本机端口，因此统一由 Nginx 写入可信的客户端地址。
	# 精确匹配的登录路由不会再丢失 X-Forwarded-For，登录 IP 审计可获得真实地址。
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        proxy_pass http://block_beast_api;
    }

    location = /readyz {
        proxy_pass http://block_beast_api;
    }

    location = /realtime/healthz {
        proxy_pass http://block_beast_realtime/healthz;
    }

    location = /v1/ws {
        limit_conn block_beast_ws 5;
        proxy_pass http://block_beast_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }

    location = /v1/auth/login {
        limit_req zone=block_beast_auth burst=5 nodelay;
        proxy_pass http://block_beast_api;
    }

    location = /v1/admin/auth/login {
        limit_req zone=block_beast_auth burst=5 nodelay;
        proxy_pass http://block_beast_api;
    }

    location ^~ /v1/ {
        limit_req zone=block_beast_api burst=200 nodelay;
        proxy_pass http://block_beast_api;
    }

    location = /docs {
        return 301 /docs/;
    }

    location = /docs/openapi.yaml {
        alias /opt/block-beast/docs/openapi.yaml;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /docs/ {
        alias /opt/block-beast/docs/;
        autoindex on;
    }

    location = /api-docs {
        return 301 /api-docs/;
    }

    location ^~ /api-docs/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

	location = /game-admin {
		return 301 /game-admin/;
	}

	# 管理后台构建时的 base path 是 /game-admin/。
	location = /game-admin/index.html {
		alias /www/wwwroot/web/index.html;
		add_header Cache-Control "no-store" always;
	}

	location ^~ /game-admin/ {
		alias /www/wwwroot/web/;
		index index.html;
		try_files $uri $uri/ /game-admin/index.html;
	}

	# 玩家端 Vite 构建资源带内容哈希，可长期缓存。
	location ^~ /assets/ {
		root /www/wwwroot/h5;
		expires 7d;
		add_header Cache-Control "public, max-age=604800, immutable";
	}

	location = /index.html {
		root /www/wwwroot/h5;
		add_header Cache-Control "no-store" always;
	}

    location / {
		try_files $uri $uri/ /index.html;
    }
}
